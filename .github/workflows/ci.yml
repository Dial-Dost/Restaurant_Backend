# =============================================================================
# CI — runs ONLY against ephemeral, throwaway infrastructure.
#
# WHY THIS FILE IS SHAPED THIS WAY. DO NOT UNDO IT.
#
# This repository serves REAL, PAYING restaurants. Until 2026-08-18 a second
# workflow, `.github/workflows/backend-ci.yml`, ran on every push to main and
# every pull request with:
#     RESTAURANT_ID: csrorganics            <- a LIVE production tenant
#     SUPABASE_DIRECT_URL / DATABASE_URL / DIRECT_URL  <- all three set to the
#                                              production Supabase repo secret
# It wrote those production credentials into `.env`, brought the full
# docker-compose stack up against them, and ran write-capable API tests. That
# workflow has been DELETED and its one piece of unique coverage (the Docker
# images build and the built image boots healthy) now lives in the `docker` job
# below, pointed at a throwaway database.
#
# RULES for anyone editing any workflow in this directory:
#   1. NEVER reference a Supabase repo secret, or any other production
#      credential, from a job that runs tests. Grepping this directory for a
#      Supabase secret reference must return NOTHING — and today no workflow
#      here references ANY repository secret at all. Keep it that way: zero
#      secrets is the property that makes reaching production impossible,
#      rather than merely unintended.
#   2. NEVER set RESTAURANT_ID (or TEST_RESTAURANT_ID) to a real tenant slug.
#      `csrorganics` is a real restaurant. Use an obviously-throwaway value.
#   3. Every database URL in this file must point at a service container or a
#      compose container that is destroyed when the job ends.
#   4a. `.github/workflows/deploy.yml` INVOKES this file via `workflow_call` and
#      will not deploy unless every job here is green. Adding that trigger is the
#      only change deploy.yml made to this file — no job, env value or command
#      below was altered, and the zero-secrets property is unchanged: a reusable
#      workflow does not inherit the caller's `environment` secrets, so the
#      production deploy key stays invisible to everything in this file. If you
#      remove `workflow_call:` from the trigger list, the deploy pipeline breaks.
#   4. NEVER set NODE_ENV=test or NODE_ENV=development for the compose stack.
#      Dockerfile.node:41 bakes NODE_ENV=production, and that is the ONLY thing
#      currently disabling the demo seed:
#          index.ts:487  shouldSeedDemo = SEED_DEMO === "true" || NODE_ENV !== "production"
#      On an EXISTING tenant that seed is not a no-op — EnsureRestaurantSeed
#      unconditionally runs `update "Login" set emp_pass = <hash("admin123")>`
#      (database_supabase.ts:~25172) and overwrites the restaurant/outlet
#      profile. Against production that silently resets the owner's password.
#      Keep NODE_ENV alone and keep the database throwaway.
# =============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Lets deploy.yml run this exact suite as the gate in front of a production
  # deploy, instead of forking or re-implementing it. Purely additive: no job
  # below behaves differently, and `github.event_name` is still the CALLER's
  # event (`push`), so the opt-in step at the bottom of the `docker` job stays
  # off exactly as it does today.
  workflow_call:
  # Manual runs only, so the opt-in valet/feedback HTTP tests in the `docker`
  # job below can be exercised deliberately. They never run automatically.
  workflow_dispatch:
    inputs:
      run_api_tests:
        description: >-
          Run the valet + feedback HTTP tests. CURRENTLY EXPECTED TO FAIL —
          see the "Valet + feedback HTTP API tests" step for why.
        type: boolean
        default: false

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Literal values only — no `secrets.*`. These point at the ephemeral service
    # containers above, which are destroyed when the job ends. `@localhost` also
    # makes database_supabase.ts:113 skip SSL, which a plain postgres:16 needs.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant
      SUPABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/restaurant
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant
      REDIS_URL: redis://localhost:6379
      QR_SIGNING_SECRET: ci-test-secret
      ALLOW_DEV_QR_SECRET: "true"

    steps:
      - uses: actions/checkout@v4

      # Runs FIRST, before the toolchain is even installed, because it needs
      # nothing but bash and takes milliseconds.
      #
      # deploy.yml reads production's health, whether a container was actually
      # recreated, and whether a rollback had anything to roll back to, out of
      # the text that `sudo /usr/local/sbin/rd-deploy status` and
      # `... rd-deploy rollback` print. That wrapper lives on the VPS and is NOT
      # in this repository, so its output format is an UNDECLARED DEPENDENCY that
      # nothing else in this tree would notice changing. The script extracts the
      # parser functions straight out of deploy.yml at run time — never a retyped
      # copy, which would drift — and runs them against captured fixtures.
      #
      # It is wired in here so the guard cannot rot. Every bug it now pins was
      # found by reading rather than by a failing test: an uptime wording the box
      # prints today (`Up About an hour`) that the parser could not read, and for
      # which it silently SKIPPED the recreation assertion; and a
      # no-rollback-target detector that fired on a rollback which had worked.
      # Do not loosen it — re-capture the fixtures instead.
      - name: Deploy parser guard (rd-deploy output format)
        run: bash deploy/vps/tests/test_status_parser.sh

      # Separate from the parser guard because they catch different failures, and
      # the second one shipped: a new image that crash-loops on boot was scored
      # "not recreated", took the no-rollback branch, and exited leaving the bad
      # build running while reporting that nothing had shipped. Reverting only
      # that one gate line reintroduces it with the parser guard still green —
      # measured. This pins the routing decision itself.
      - name: Deploy routing guard (does a crash-loop roll back?)
        run: bash deploy/vps/tests/test_deploy_routing.sh

      # The third undeclared dependency, and the first one that WRITES TO THE
      # PRODUCTION DATABASE. `rd-deploy migrate` cannot read an exit code to tell
      # "pending" from "clean" — scripts/migrate.ts returns 0 either way — so it
      # keys on two SENTENCES that file prints. This pins those sentences, the
      # pending-file parser, dump retention (deleting the newest dump instead of
      # the oldest is the one retention bug that costs anything), rd-entry's
      # acceptance of `migrate` with no service argument, and deploy.yml's
      # routing of rd-migrate's exit codes.
      #
      # The routing assertion that matters most is 64. It means "the box does not
      # have the verb installed yet", and the generic handler would report it as
      # a bug in the workflow file — the same misdiagnosis that once rendered a
      # missing forced command (127) as PENDING MIGRATION. Needs nothing but bash.
      - name: Migrate verb guard (rd-migrate contract and exit-code routing)
        run: bash deploy/vps/tests/test_migrate_contract.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Money invariants. Runs FIRST because it needs neither a database nor
      # Docker: the bill set is in memory and only `pg` is faked, so the real
      # report readers are exercised. Placed first so a service-charge / tax
      # regression fails the build in seconds and can never be masked by an
      # unreachable DB or a docker problem. (The full jest run below repeats it;
      # this step exists for the fast, unambiguous signal.)
      - name: Money invariants (bill totals vs report readers)
        run: npm run test:money

      # Express matches routes in REGISTRATION ORDER, so reordering two routes,
      # or letting a broad path shadow a narrow one, is a silent behaviour change
      # that no unit test sees. scripts/route_manifest.ts re-derives the live
      # order from source and diffs it against the committed baseline; exit 2
      # means drift (its own docblock, line 69). Until now it was run by hand,
      # which means it was run when someone remembered to.
      #
      # Sits here with the other fast signals for the same reason test:money
      # does: it needs neither a database nor Docker. It never imports, boots or
      # executes the app, opens no socket and touches no database — it only
      # parses source — so it cannot be masked by an unreachable DB or a docker
      # problem, and it fails in seconds.
      #
      # If this fails and the route change was INTENTIONAL, regenerate the
      # baseline deliberately and review the diff:
      #     npx tsx scripts/route_manifest.ts --out scripts/route_manifest.baseline.txt
      # (--out is the form the script itself documents at scripts/route_manifest.ts:63)
      - name: Route manifest (Express registration order must not drift)
        run: npm run test:routes

      - name: Typecheck
        run: npm run build

      - name: Unit tests
        run: npx jest --runInBand --passWithNoTests

      # Migration chain + tenant-isolation regression. `000_base_schema.sql` now
      # bootstraps the base tables on the ephemeral Postgres, so the full chain
      # (000 → roles → fail-closed RLS → platform/billing) must apply cleanly —
      # this is the blocking gate against a broken migration reaching deploy.
      # (test:isolation needs a live backend + two seeded tenants via TEST_A/B_*
      # env; absent those it skips, so here it asserts the migrations apply.)
      - name: Migrations + tenant isolation
        run: |
          npm run migrate
          npm run test:isolation

      # End-to-end money/flow tests against the real ephemeral Postgres (seeds a
      # throwaway restaurant; the test refuses any non-local DB). Covers the atomic
      # waitlist seat (transaction + double-seat/occupied-table guards).
      - name: Integration tests (real Postgres)
        run: npm run test:integration

  # ===========================================================================
  # Container packaging smoke test.
  #
  # This is the ONLY coverage the deleted backend-ci.yml had that the `backend`
  # job above does not: that Dockerfile.node and Dockerfile.python actually
  # build, and that the compiled `build/index.js` boots on pruned production
  # node_modules and answers /health. That catches a broken Dockerfile, a
  # runtime dependency stripped by `npm prune --omit=dev`, a missing tsx for
  # migrations, or a uv sync failure — none of which the runner-side jobs see.
  #
  # /health returns 503 when the database is unreachable (routes/misc.ts:58-64),
  # so a 200 here also proves the container reached its database. That database
  # is the throwaway Postgres from .github/docker-compose.ci.yml — NEVER a
  # production one.
  # ===========================================================================
  docker:
    runs-on: ubuntu-latest

    env:
      # Node 22 matches Dockerfile.node's runtime, so the runner-side migrate
      # runs on the same major version as the image.
      COMPOSE_FILES: -f docker-compose.yml -f .github/docker-compose.ci.yml
      BACKEND_API_BASE_URL: http://localhost:3001
      # Runner-side view of the throwaway DB (published by the CI override).
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Container-facing environment. LITERALS ONLY — no `secrets.*` appears
      # anywhere in this file, which is what makes it structurally impossible
      # for this workflow to reach production.
      #
      #  * host is `postgres` (the compose service), not localhost: inside a
      #    container localhost is the container itself.
      #  * `?sslmode=disable` is REQUIRED. database_supabase.ts:113 only skips
      #    SSL for @localhost/@127.0.0.1/@[::1]; any other host defaults to SSL,
      #    which a plain postgres:16 does not speak. psycopg honours it too.
      #  * QR_SIGNING_SECRET must be explicit: qr_signing.ts refuses to boot on
      #    the published dev fallback, and the image sets NODE_ENV=production so
      #    the ALLOW_DEV_QR_SECRET escape hatch is unavailable.
      #  * NODE_ENV and SEED_DEMO are deliberately NOT set. See the header.
      - name: Write CI .env (throwaway credentials only)
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@postgres:5432/restaurant?sslmode=disable
          SUPABASE_DIRECT_URL=postgres://postgres:postgres@postgres:5432/restaurant?sslmode=disable
          DIRECT_URL=postgres://postgres:postgres@postgres:5432/restaurant?sslmode=disable
          REDIS_URL=redis://redis:6379
          QR_SIGNING_SECRET=ci-only-non-secret-qr-key-for-tests
          EOF
          echo "Wrote .env with $(wc -l < .env) throwaway settings (no secrets)."


      # Bring up ONLY the throwaway datastores first, so migrations can create
      # the schema before the app containers boot into it.
      - name: Start throwaway Postgres + Redis
        run: docker compose $COMPOSE_FILES up -d --wait postgres redis

      - name: Apply migrations to the throwaway Postgres
        run: npm run migrate

      # GEMINI_API_KEY is intentionally absent. It is read only inside
      # generate_questions() (Python_servers/questions.py:136), which is an
      # APScheduler job registered for 02:00 and never runs during a CI job;
      # without it the function logs and returns. The Node routes
      # /get_main_feedback_question and /get_follow_up_question return a static
      # fallback question when Python is unreachable, so no CI path needs a key.
      - name: Build images and start the stack
        run: docker compose $COMPOSE_FILES up -d --build

      # Generous budget: the images are cold and Dockerfile.node's own
      # healthcheck has a 40s start period. The old workflow allowed 20s.
      - name: Wait for /health (proves the built image boots and reaches its DB)
        run: |
          for i in $(seq 1 90); do
            if curl -sSf "$BACKEND_API_BASE_URL/health" > /dev/null 2>&1; then
              echo "Backend healthy after ~$((i * 2))s"
              curl -sS "$BACKEND_API_BASE_URL/health"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy within 180s"
          exit 1

      # -----------------------------------------------------------------------
      # OPT-IN ONLY. Never runs on push or pull_request.
      #
      # HONEST STATUS: these two suites (test/valet_api_test.ts,
      # test/feedback_api_test.ts) CANNOT PASS TODAY, against this stack or any
      # other. They authenticate with X-Restaurant-Id / X-Employee-Id /
      # X-Action-List headers, but the backend moved to session-only auth:
      # index.ts:104 rejects any non-PUBLIC_PATHS request without a bearer token,
      # and routes/_shared.ts:67 reads permissions from req.auth, never a header.
      # X-Action-List is dead in application code — it now appears only in these
      # test files. So:
      #   * valet_api_test.ts:50  POST /create_valet_record -> 401, exit 1
      #   * feedback_api_test.ts:51 GET /feedback?limit=5   -> 401, exit 1
      #
      # COVERAGE LOST BY NOT RUNNING THESE AUTOMATICALLY: the valet and feedback
      # HTTP surfaces. In practice that coverage was ALREADY zero — every
      # assertion past the first authenticated call has been unreachable since
      # the session-auth refactor. The old workflow was red (or ignored), not
      # green. Nothing that was passing has been switched off.
      #
      # TO RESTORE IT (small, mechanical, and worth doing): rewrite both files
      # onto the existing helper test/_auth.ts — `login()` + `authHeaders()`,
      # exactly as test/tenant_isolation_test.ts already does — seed a
      # throwaway tenant the way test/integration/money_integration_test.ts:78
      # does (`ITest ${randomUUID().slice(0,8)}`), and take res_id / outlet_id /
      # employeeId from the login response. The hardcoded UUIDs at
      # valet_api_test.ts:5-6 are PRODUCTION row ids and must be deleted; a
      # freshly seeded tenant generates its own. No fixture data is needed —
      # migrations/000_base_schema.sql already creates Parking_Bays,
      # Valet_vehicle_state, Valet_vehicle_meta and feedback_questions.
      # Once that lands, move this step out of the `if:` gate.
      #
      # The test files are deliberately left UNMODIFIED and UNDELETED.
      # -----------------------------------------------------------------------
      - name: Valet + feedback HTTP API tests (opt-in; currently failing by design)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_api_tests == 'true'
        env:
          # Throwaway slugs. NEVER `csrorganics` — that is a live tenant, and it
          # is what both test files fall back to when these are unset.
          RESTAURANT_ID: citestthrowaway
          TEST_RESTAURANT_ID: citestthrowaway
        run: |
          echo "NOTE: these suites are expected to fail with 401 until they are"
          echo "rewritten onto test/_auth.ts. See the comment above this step."
          npm run test:feedback_api
          npm run test:valet_api

      - name: Container logs (on failure)
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color --tail=200

      # `down -v` also drops the throwaway database volume.
      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_FILES down -v --remove-orphans
