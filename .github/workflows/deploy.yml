# =============================================================================
# Deploy (production) — Restaurant_Backend
#
# CI (incl. the route-manifest gate) -> Gate A (does this push add SQL?) -> tell
# the box to fetch main and rebuild -> PROVE it happened -> poll until healthy ->
# roll the image back if it does not come back.
#
# THE TRANSPORT IS GIT. THERE IS NO REGISTRY IN THIS PIPELINE.
# -----------------------------------------------------------------------------
# An earlier version of this file built both images on the runner, pushed them to
# GHCR by digest, and moved a `:prod` tag that the box's compose file followed.
# That is gone. GHCR needed a long-lived read credential in *root's* docker
# config on the box, and it could not be created without a human at a keyboard.
# Every trace of the registry design — buildx, `docker login`, digest resolution,
# tag moves, `pull_policy: always`, `restore_tags`, the `packages: write`
# permission — has been DELETED rather than left commented out, because a
# half-present transport is how you get a pipeline that half-ships.
#
# What replaced it:
#
#     /opt/restaurant-dash/Restaurant_Backend  is a real git clone of this repo,
#     on main, working tree clean, fetched with a per-repo READ-ONLY deploy key.
#     /opt/restaurant-dash/docker-compose.yml (NOT in git; it exists only on the
#     box) builds that directory as a LOCAL BUILD CONTEXT.
#
# So code reaches production by the box fetching this repo and rebuilding. CI
# holds no image, no digest and no registry credential. The only secret this
# workflow can see is an SSH key pinned to a forced command.
#
# WHAT THAT COSTS, STATED PLAINLY
# -----------------------------------------------------------------------------
# The production box now compiles its own deploys. `tsc` and the python image
# build on a 2-vCPU VPS next to live POS traffic, with real memory pressure, and
# the build now happens INSIDE the deploy window instead of before it. That is a
# genuine regression against the registry design and it is the price of not
# needing a registry credential. Deploy outside service hours, and expect this
# job to take minutes rather than seconds — hence `timeout-minutes: 60`.
#
# THE SERVER SIDE IS FIXED. THIS FILE MUST MATCH IT, NEVER THE OTHER WAY ROUND
# -----------------------------------------------------------------------------
# The CI identity can cause EXACTLY ONE program to run: /usr/local/sbin/rd-deploy
# (root-owned, granted by a wildcard-free sudoers line), reached through the SSH
# forced command /usr/local/sbin/rd-entry. The whole vocabulary is:
#
#     status                -> "<svc><TAB><status>" lines, NO header row
#     revision              -> "<repo-dir><TAB><40-char sha>", one line per repo
#     logs [svc]            -> compose logs --tail 100
#     check-migrations      -> prints the migrate dry-run verdict; applies nothing
#     update <svc>          -> git fetch + reset --hard FETCH_HEAD, prints
#                              "revision <12ch> -> <12ch>", THEN the migration
#                              gate, THEN tags the outgoing image :previous,
#                              THEN compose build + up -d
#     deploy [svc]          -> migration gate then up -d (NO rebuild)
#     rollback [svc]        -> retag <img>:previous back to :latest, then
#                              force-recreate
#
# `svc` is backend | dashboard | python. `valkey` is refused everywhere by
# rd-entry, and `update` refuses a bare form. Unknown verb or unknown service =>
# exit 64. Pending migration => exit 65, and the wrapper NEVER applies one.
#
# WHY `update` AND NEVER `deploy` — this is the point of the rewrite
# -----------------------------------------------------------------------------
# `deploy` is `up -d` with NO rebuild. Against a local-context compose file it
# converges on the image already on disk — the SAME image — so the pipeline would
# go green having shipped nothing at all. `update` is the verb that fetches and
# rebuilds. This workflow sends `update <svc>` and nothing else. `deploy` stays in
# the grammar for a human converging the stack after editing compose by hand; CI
# must never send it.
#
# HOW THIS RUN PROVES IT ACTUALLY SHIPPED
# -----------------------------------------------------------------------------
# Two independent signals, both required, because either one alone can lie:
#
#   1. `revision` — the deployed git SHA must equal github.sha afterwards. Proves
#      the CODE reached the box. It does NOT prove a container was rebuilt:
#      `update` resets the working tree BEFORE its migration gate runs, so a run
#      that dies at exit 65 leaves the tree at the new commit while the containers
#      still run the old build.
#   2. RECREATION, derived from CHANGE and never from absolute age. `status` is
#      snapshotted BEFORE the first `update` and read again afterwards; a service
#      whose uptime RESET was recreated. Proves a NEW IMAGE is running. It does
#      not prove which commit built it.
#
#      It is a comparison, not a threshold, and that is the whole point. The box
#      compiles its own deploys on 2 vCPUs, so the interval between the two
#      snapshots is routinely longer than any fixed "the container must be
#      younger than N minutes" rule would tolerate — `timeout-minutes: 60` below
#      is this file's own admission of that. A reset is a reset however long the
#      build took and however docker chose to word the duration.
#
#      NOT EVERY SERVICE HAS TO MOVE. The rule is AT LEAST ONE updated service
#      must show the reset. A service that did not is named in a `::notice::`,
#      never treated as a failure, and the summary never says "nothing shipped"
#      while the backend was replaced.
#
#      DO NOT re-derive that rule from "a cache-hit rebuild does not recreate".
#      MEASURED ON THIS BOX, IT DOES. buildx 0.36.1 stamps a provenance
#      attestation into every build, so a rebuild with no source change still
#      produces a NEW IMAGE ID —
#
#          before          sha256:129c9f26d3403a54be6
#          after, no change  sha256:389d5ce34d2de9f0d45
#
#      — and `up -d` swaps the container: `rd-deploy update python` with nothing
#      changed took python's uptime from 46 hours to 12 seconds. An earlier
#      version of this comment claimed the opposite and put a number on it
#      ("roughly 92% of backend deploys would otherwise fail"); that number
#      described a box this is not.
#
#      The at-least-one rule stays, and not as a leftover. It does not depend on
#      that behaviour in either direction, it survives a buildx that stops
#      stamping provenance, and it is what keeps a build longer than any fixed
#      "younger than N minutes" window from red-lighting a deploy that worked.
#
# Together they are a deploy. Separately they are each a way to report success
# without shipping, which is the specific failure this design exists to prevent.
#
# WHAT ROLLBACK CAN AND CANNOT RESTORE
# -----------------------------------------------------------------------------
# `rollback <svc>` retags <img>:previous back to :latest and force-recreates, so
# it DOES revert the running code — `update` tagged the outgoing image :previous
# before it built. Two hard limits, both surfaced in the failure output:
#
#   * THE GIT WORKING TREE ON THE BOX STAYS AT THE NEW COMMIT. Rollback does not
#     `git reset` anything. The next `update` of any service in this repo — a
#     re-run, or someone deploying an unrelated fix — rebuilds the BAD commit and
#     ships it again. The only durable fix is to revert the commit on main.
#   * On the FIRST `update` of a service there is no :previous image. The wrapper
#     then warns on stderr that the code is NOT reverted, and force-recreates
#     anyway. That is a restart, not a rollback, and this workflow must never
#     report it as one.
#
# THIS WORKFLOW NEVER APPLIES A MIGRATION and holds no database credential.
# See deploy/vps/README.md for secrets, manual deploys and manual rollback.
# =============================================================================
name: Deploy (production)

# TRIGGER — DELIBERATELY workflow_dispatch ONLY IN THIS COMMIT.
#
# The push trigger is ON, added in this second, trigger-only commit. The
# precondition it was withheld for has been met: run 32649217390 was dispatched
# by hand against live production and observed end to end —
#
#     CI green -> Gate A -> update python -> update backend -> proof -> healthy
#     "Deploy succeeded at 38be891. Recreated: backend. Not recreated: python.
#      Containers healthy; public probe answering."
#
# That run also exercised the partial-recreation case for real: python was a
# cache hit and did NOT recreate, and the pipeline reported it as a notice
# rather than failing, because backend did. Worth knowing, because an earlier
# measurement on this box suggested every rebuild yields a new image id (buildx
# stamps a provenance attestation) — that is NOT reliable, and a design that
# assumed it would have failed this deploy.
#
# Nothing downstream depends on the event type. `concurrency`, the job graph and
# every `needs:` behave identically on a dispatched run; Gate A detects a
# non-push event and skips, deferring to the authoritative server-side gate
# (exit 65), which still runs inside `update`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight. A cancelled run can leave the box's working
# tree reset to the new commit with the containers still on the old build — the
# one state this pipeline cannot tell apart from a successful deploy without both
# of its proofs. A newer run queues behind the running one.
#
# NOTE: concurrency groups are PER-REPOSITORY. This cannot serialise a backend
# deploy against a Restaurant_Dashboard_UI deploy. See deploy/vps/README.md,
# "Cross-repo ordering", for what that costs and what the dashboard does about it.
concurrency:
  group: production-deploy-backend
  cancel-in-progress: false

# No `packages:` anywhere in this file any more — nothing here talks to a
# registry. Repository default workflow permissions are read-only, but a
# workflow-level `permissions:` key can still elevate, so it is stated explicitly
# and kept at the minimum.
permissions:
  contents: read

env:
  # The DIRECTORY BASENAME of this repo's clone on the box
  # (/opt/restaurant-dash/Restaurant_Backend). `rd-deploy revision` keys its
  # output on exactly this string, and it is also the path printed in the
  # migration instructions. If the clone is ever moved or renamed, this is the one
  # value that has to change with it.
  REVISION_KEY: Restaurant_Backend
  # Public, through the same ingress a restaurant uses. A `vars.` override wins so
  # the URL can change without a commit; the default is the live one.
  PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://api.dialdost.com/health' }}

jobs:
  # ---------------------------------------------------------------------------
  # HARD GATE. The existing CI suite, unchanged and not forked: money invariants,
  # typecheck, unit tests, the route-manifest gate (npm run test:routes),
  # migration chain + tenant isolation, real-Postgres integration tests, container
  # smoke test. Node 22, holds no secret.
  #
  # Everything below `needs:` this, directly or transitively, so a red CI makes
  # the deploy job UNREACHABLE — not skippable, not overridable from this file.
  # Do not weaken it here and do not add `continue-on-error` to it.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # GATE A — zero-credential pending-migration check.
  #
  # Does THIS push carry SQL? If so, refuse before an SSH connection is opened and
  # before the box's working tree is moved. This gate holds no database URL and
  # makes no network call; it is a git diff.
  #
  # It cannot see a migration added in an earlier push that nobody applied. That
  # is what the server-side gate (exit 65) is for. Two gates on purpose: this one
  # is cheap, that one is true.
  #
  # In the registry version this job had to run AFTER the build so it could name
  # the digest that carried the SQL. There is no digest now, so it runs first and
  # a refusal leaves the box completely untouched.
  # ---------------------------------------------------------------------------
  migration_gate:
    name: Pending migration gate (Gate A)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # SHA-PINNED. `v4` is a LIGHTWEIGHT, force-moved tag: whoever can move it
      # can change what this job runs. Pin the commit; keep the human-readable
      # version in the comment. Bump both together, never one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Refuse to deploy a push that carries a migration
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "push" ]; then
            echo "Gate A skipped: this is a $EVENT run, which has no previous commit to diff."
            echo "This is also the intended way to RE-RUN a deploy after applying a migration by"
            echo "hand. The server-side gate inside 'update' is authoritative and still runs."
            exit 0
          fi
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::Gate A skipped (no previous commit recorded). Server-side gate still applies."
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::notice::Gate A skipped ($BEFORE is not in this clone — force-push or squash). Server-side gate still applies."
            exit 0
          fi

          CHANGED="$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- migrations/ | grep -E '\.sql$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "No migration files changed in this push."
            exit 0
          fi

          {
            echo "## Deploy refused: this push carries migration SQL"
            echo
            echo "Migrations are a **manual release step** on this project. The production"
            echo "database has no PITR, so nothing in this pipeline will ever apply schema"
            echo "changes for you. Nothing was deployed and the box was not contacted."
            echo
            echo "Files added or changed by this push:"
            echo
            echo '```'
            echo "$CHANGED"
            echo '```'
            echo
            echo "### Getting the SQL onto the box, then applying it"
            echo
            echo "The migration files are not on the VPS yet — nothing has fetched this commit."
            echo "Use the wrapper's own refusal to place them, **as root on the VPS**:"
            echo
            echo '```sh'
            echo "# 1. Resets /opt/restaurant-dash/Restaurant_Backend to main, THEN refuses with"
            echo "#    exit 65 without building. That refusal is the point: the new migrations/"
            echo "#    are now on disk and no container has been touched."
            echo "sudo /usr/local/sbin/rd-deploy update backend ; echo \"expect 65, got \$?\""
            echo
            echo "# 2. Name what is pending."
            echo "sudo /usr/local/sbin/rd-deploy check-migrations"
            echo '```'
            echo
            echo "Then apply it — \`deploy/vps/README.md\`, **Applying a migration**, carries the"
            echo "exact command and the two assumptions it makes — and confirm"
            echo "\`check-migrations\` comes back clean."
            echo
            echo "Then re-run this workflow from the **Actions tab** (Run workflow). A"
            echo "\`workflow_dispatch\` run skips Gate A, which is exactly why it exists;"
            echo "re-running the *push* would just fail here again."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Pending migration(s) in this push — deploy refused, the box was not contacted. Apply them by hand (the job summary has the exact steps), then re-run this workflow from the Actions tab. Files:"
          echo "$CHANGED"
          exit 1

  # ---------------------------------------------------------------------------
  # The only job that can see a secret.
  #
  # `environment: production` is the single highest-value control in this design:
  # environment secrets are not readable by a run on a feature branch or a pull
  # request, and the environment's deployment branches are restricted to `main`.
  #
  # It uses NO third-party actions at all. There is nothing to check out (this job
  # needs github.sha and an ssh client, both of which the runner already has) and
  # nothing to log in to, so the supply chain of the job that holds the production
  # key is: ssh, curl, and the shell.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production VPS
    # The `production` environment's deployment-branch rule already restricts
    # this to `main`, but that rule lives in repository Settings where nobody
    # reading this file can see it. State it here as well so the branch
    # restriction is self-evident in the pipeline itself, and so it survives
    # someone loosening the environment by accident. Two checks, one of which is
    # in version control.
    if: github.ref == 'refs/heads/main'
    # `migration_gate` already needs `ci`; naming both keeps the CI hard-gate
    # visible in this job even if the gate is ever restructured.
    needs: [ci, migration_gate]
    runs-on: ubuntu-latest
    # The box builds now. A cold backend + python build on 2 vCPUs is minutes, and
    # the health poll can add several more. 30 was sized for a registry pull.
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH (host key pinned; never StrictHostKeyChecking=no)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::secret DEPLOY_SSH_KEY is not set on the 'production' environment. It is an ENVIRONMENT secret, not a repository secret — check Settings > Environments > production > Secrets, not Settings > Secrets."
            exit 1
          fi
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::variable SSH_KNOWN_HOSTS is not set. Refusing to connect without a pinned host key. The alternative — StrictHostKeyChecking=no — would let anyone on the runner's network path present their own host key, take the session, and collect the deploy key. Set it from 'ssh-keyscan -p <port> <host>'."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update python and backend from git, prove it, verify, roll back on failure
        id: deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # GitHub runs `run:` blocks as `bash -e {0}`, so errexit is ON unless it
          # is explicitly turned off — and `set -uo pipefail` does NOT turn it off.
          # This whole step is built around inspecting exit codes (64 grammar, 65
          # pending migration, 127 forced command missing, 255 ssh transport). With
          # errexit left on, the first `rd ...` that returns non-zero would kill
          # the step before a single line of that handling ran, and every failure
          # would surface as a bare "Process completed with exit code 65".
          set +e
          : "${DEPLOY_HOST:?variable DEPLOY_HOST is not set}"
          : "${DEPLOY_USER:?variable DEPLOY_USER is not set}"
          : "${GIT_SHA:?github.sha is empty}"
          : "${REVISION_KEY:?REVISION_KEY is not set (workflow env)}"
          PORT="${DEPLOY_PORT:-22}"

          HEALTH_TIMEOUT=240     # Dockerfile.node start-period is 40s, plus margin
          HEALTH_INTERVAL=6
          PUBLIC_TIMEOUT=120     # the ingress can lag a container swap by seconds
          PUBLIC_INTERVAL=6

          # -------------------------------------------------------------------
          # The ONLY way this workflow talks to the box. Every call must be a
          # sentence rd-entry's grammar accepts or it comes back 64. ssh itself
          # returns 255 on a transport failure; that is not a wrapper exit code and
          # must never be mistaken for one.
          #
          # ServerAlive* is new for the git transport: `update` now runs a docker
          # build on the far end and can be quiet for minutes. 30s x 20 tolerates
          # ten minutes of silence before the client gives up on the connection.
          # -------------------------------------------------------------------
          rd () {
            ssh -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o BatchMode=yes \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=20 \
                -p "$PORT" \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "$@"
          }

          summary () { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          block () { summary ''; summary '```'; cat "$1" >> "$GITHUB_STEP_SUMMARY"; summary '```'; summary ''; }
          fail () { local code="$1"; shift; echo "::error::$*"; exit "$code"; }

          # ---- exit 127 -------------------------------------------------------
          # 127 is NOT one of rd-deploy's codes (64 / 65) and NOT ssh's transport
          # code (255). It is a LOGIN SHELL's "command not found": ssh
          # authenticated, got a session, and tried to run a program literally
          # named `revision` / `update` / `status`. That happens only when the SSH
          # forced command is not in place — either /home/deploy/.ssh/authorized_keys
          # has lost its command="/usr/local/sbin/rd-entry" prefix, or rd-entry
          # itself is gone or not executable. The wrapper is never reached, so
          # nothing on the box was inspected and nothing was changed.
          #
          # The forced command was PROVEN installed with the real private key
          # (interactive session refused, `cat .env` refused, bare `deploy`
          # refused, `status` and `revision` working), so a 127 today is not an
          # unfinished install — it is a CHANGE TO THE SECURITY BOUNDARY. Treat it
          # as one.
          #
          # It needs a case of its own EVERYWHERE an rd exit code is read. Without
          # one it lands in a generic non-zero branch and, at the update call site,
          # gets printed under a PENDING MIGRATION heading — a flat misdiagnosis
          # that sends someone hunting a migration that does not exist.
          not_installed () { # "<the rd sentence that came back 127>"
            summary "## Deploy aborted — the forced command is not in place (exit 127)"
            summary ""
            summary "\`ssh $DEPLOY_USER@$DEPLOY_HOST $1\` returned **127 = command not found**. That is"
            summary "the login shell's exit code, not one of \`rd-deploy\`'s: sshd ran \`$1\` as a"
            summary "program name because no forced command replaced it, and no such program exists."
            summary ""
            summary "**Nothing was inspected and nothing was changed on the box.** In particular,"
            summary "nothing is known about migrations from this run — the question was never asked."
            summary ""
            summary "This is not an unfinished install. The forced command was proven working from a"
            summary "workstation with the real private key. Something has since removed or rewritten"
            summary "it, which means the blast radius of \`DEPLOY_SSH_KEY\` may currently be a shell"
            summary "account on a box holding live restaurant data. **Check that first, then fix.**"
            summary ""
            summary "On the VPS, as root:"
            summary ""
            summary '```sh'
            summary "grep -n 'rd-entry' /home/deploy/.ssh/authorized_keys   # expect ONE restrict,command= line"
            summary "stat -c '%U:%G %a' /usr/local/sbin/rd-entry            # expect root:root 755"
            summary "sudo -u deploy sudo -n /usr/local/sbin/rd-deploy status"
            summary '```'
            summary ""
            summary "Then re-prove it from a workstation before re-running this workflow:"
            summary ""
            summary '```sh'
            summary "ssh -i ci-deploy $DEPLOY_USER@$DEPLOY_HOST revision   # should print one line per repo"
            summary "ssh -i ci-deploy $DEPLOY_USER@$DEPLOY_HOST            # MUST be refused (no shell)"
            summary '```'
            summary ""
            summary "See \`deploy/vps/README.md\`, *The exact authorized_keys line*, and"
            summary "\`deploy/vps/rd-entry\`."
          }

          # ---- exit 64 --------------------------------------------------------
          # EX_USAGE, from EITHER rd-entry or rd-deploy: this workflow sent a
          # sentence the grammar does not accept. That is A BUG IN THIS FILE, not a
          # fault on the box, and nothing there was changed. It cannot be fixed by
          # re-running.
          grammar_bug () { # "<sentence sent>" <capture-file>
            summary "## Deploy aborted — the wrapper rejected the command (exit 64)"
            summary ""
            summary "This workflow sent \`$1\`, and the grammar refused it. Exit 64 is EX_USAGE and it"
            summary "is **a pipeline bug, not an application failure**. Nothing on the box changed."
            summary ""
            summary "What came back:"
            block "$2"
            summary "The accepted grammar, as installed:"
            summary ""
            summary '```'
            summary "rd-deploy   status | revision | check-migrations        (no service argument)"
            summary "            logs [backend|dashboard|python]"
            summary "            update|deploy|rollback <backend|dashboard|python>"
            summary ""
            summary "rd-entry    the same, MINUS valkey anywhere and MINUS a bare"
            summary "            update/deploy/rollback. It is never wider than the wrapper."
            summary '```'
            summary ""
            summary "See \`deploy/vps/WRAPPER_CONTRACT.md\` and \`deploy/vps/rd-entry\`."
            fail 64 "EXIT 64 = BAD ARGUMENTS. This workflow sent '$1', which neither rd-entry nor rd-deploy accepts. It is a bug in .github/workflows/deploy.yml — re-running will not help. Nothing on the box was changed. The accepted grammar is in the job summary and in deploy/vps/WRAPPER_CONTRACT.md."
          }

          # ---- exit 65 --------------------------------------------------------
          # The server-side gate, and the only migration authority in this design.
          #
          # It fires INSIDE `update`, i.e. AFTER the working tree has already been
          # reset to this commit. That is why the re-ask below names the migration
          # files THIS commit carries rather than the previous set. Nothing in
          # this design moves the tree back afterwards, so `check-migrations`
          # asked here answers about the commit that was just refused, which is
          # the question the operator actually has.
          #
          # The cost of that same property: the tree HAS moved. Say so plainly;
          # "nothing was deployed" is true of the containers and false of the box.
          migration_refused () { # <svc> <capture-file>
            local svc="$1" cap="$2" m2rc
            summary "## Deploy refused by the server — pending migration (exit 65)"
            summary ""
            summary "\`rd-deploy update $svc\` fetched this commit, reset"
            summary "\`/opt/restaurant-dash/$REVISION_KEY\` to it, and then refused to build."
            summary ""
            summary "\`rd-deploy update $svc\` said:"
            block "$cap"
            summary "Re-asking for the names. The working tree is now at \`$GIT_SHA\`, so this sees"
            summary "the migration set **this commit** carries:"
            rd check-migrations > migrations-after-65.txt 2>&1
            m2rc=$?
            block migrations-after-65.txt
            if [ "$m2rc" -eq 127 ]; then not_installed "check-migrations"; fi
            summary "### The state of the box right now"
            summary ""
            summary "| | |"
            summary "|---|---|"
            summary "| working tree | **moved** to \`$GIT_SHA\` |"
            summary "| running containers | **unchanged** — still the previous build |"
            summary "| \`:previous\` image tags | untouched (\`update\` writes them only after the gate passes) |"
            summary "| database | **untouched**. This pipeline has no database credential and will never apply a migration |"
            summary ""
            if [ "${#UPDATED[@]}" -gt 0 ]; then
              summary "> **The \"running containers\" row is true only of \`$svc\`.** \`${UPDATED[*]}\` WAS"
              summary "> rebuilt and swapped by this run before the gate fired, so production is a new"
              summary "> \`${UPDATED[*]}\` against an old \`$svc\`. Put the sidecar back on its previous"
              summary "> image with \`sudo /usr/local/sbin/rd-deploy rollback ${UPDATED[*]}\` while you"
              summary "> apply the migration."
              summary ""
            fi
            summary "### Apply it, as root on the VPS"
            summary ""
            summary '```sh'
            summary "# The new migrations/ are already on disk from the reset above. Run them with"
            summary "# the CURRENTLY DEPLOYED image (nothing has been rebuilt), overlaying the new"
            summary "# migration files read-only. Nothing here disturbs the :previous rollback tag."
            summary "docker run --rm --env-file /opt/restaurant-dash/.env.migrate \\"
            summary "    -v /opt/restaurant-dash/$REVISION_KEY/migrations:/app/migrations:ro \\"
            summary "    restaurant-dash-backend:latest npm run migrate"
            summary ""
            summary "sudo /usr/local/sbin/rd-deploy check-migrations   # must now come back clean"
            summary '```'
            summary ""
            summary "> That command makes two assumptions, both cheap to check first: the image's"
            summary "> WORKDIR is \`/app\`"
            summary "> (\`docker image inspect -f '{{.Config.WorkingDir}}' restaurant-dash-backend:latest\`)"
            summary "> and \`npm run migrate\` reads \`migrations/\` relative to it. See"
            summary "> \`deploy/vps/README.md\`, *Applying a migration*, which also lists the"
            summary "> rebuild-instead alternative and why it is the worse one."
            summary ""
            summary "Then re-run this workflow from the Actions tab."
            fail 65 "PENDING MIGRATION (server gate, exit 65). Nothing was rebuilt and no container was replaced — but the working tree on the box HAS moved to $GIT_SHA, so a later 'update' will build this commit. The migration names and the exact command to apply them are in the job summary. Apply them as root on the VPS, then re-run this workflow."
          }

          # ---- a failed `update backend` after a successful `update python` ----
          # "Services already updated by this run: python" is true and useless. It
          # does not say what production IS, it does not say that the working tree
          # has already moved, and it does not offer the one command that undoes
          # the half that landed.
          #
          # The working tree matters more than it looks: the FIRST `update` of this
          # repo is the one that fetches and `reset --hard`s, and it is the one
          # that succeeded. So the tree is at the deployed sha and the NEXT update
          # of ANY service in this repo — including a re-run of this workflow, and
          # including someone shipping an unrelated fix — rebuilds the same bad
          # commit.
          half_deployed () { # <the service whose update failed>
            if [ "${#UPDATED[@]}" -eq 0 ]; then
              summary "No service was updated by this run."
              summary ""
              return 0
            fi
            summary "### What production is actually running now"
            summary ""
            summary "| | |"
            summary "|---|---|"
            summary "| rebuilt and swapped by this run | **${UPDATED[*]}**, at \`$GIT_SHA\` |"
            summary "| NOT rebuilt | **$1**, still the previous build |"
            summary "| working tree \`/opt/restaurant-dash/$REVISION_KEY\` | **already at \`$GIT_SHA\`** |"
            summary ""
            summary "The stack is **mismatched**: a new \`${UPDATED[*]}\` sidecar running against an"
            summary "old \`$1\`. Expand/contract makes that direction usually survivable, but it is"
            summary "not what you released and it is not a state to leave production in."
            summary ""
            summary "**The tree has already moved.** The first \`update\` is the one that fetches and"
            summary "\`reset --hard\`s, and it succeeded, so \`/opt/restaurant-dash/$REVISION_KEY\` is"
            summary "now at \`$GIT_SHA\` — the commit that just failed. **The next \`update\` of any"
            summary "service in this repo rebuilds THAT commit**, including a re-run of this"
            summary "workflow and including someone shipping an unrelated fix. Do not assume a"
            summary "re-run ships something different: fix the build, or \`git revert\` on \`main\`."
            summary ""
            summary "To put the sidecar back on its previous image while you do:"
            summary ""
            summary '```sh'
            for _s in "${UPDATED[@]}"; do
              summary "sudo /usr/local/sbin/rd-deploy rollback $_s"
            done
            summary '```'
            summary ""
            summary "That reverts the IMAGE only. It does not move the working tree back."
            summary ""
          }

          # =====================================================================
          # PARSERS. deploy/vps/tests/test_status_parser.sh EXTRACTS THIS REGION
          # from this file at run time — from `svc_line () {` to the end of
          # `assert_recreated () {` — and runs it against captured fixtures, so
          # that a change to the wrapper's output format fails a test instead of a
          # production deploy. Keep them contiguous, keep them at this indent, keep
          # `assert_recreated` last, and keep the region free of anything that is
          # not a function definition: the test sources it.
          #
          # The test asserts on svc_line, rev_of, svc_verdict, uptime_secs,
          # noprev_warned, restored_previous and assert_recreated. Add a function
          # here and add it there. `ci.yml` runs that script on every push, so this
          # guard cannot rot unnoticed.
          # =====================================================================
          svc_line () { grep -E "(^|[[:space:]])$1([[:space:]]|\$)" "$2" | head -n1 || true; }

          # `rd-deploy revision` prints one "<repo-dir><TAB><40-char sha>" line per
          # repo. Default awk field splitting handles both the tab the wrapper
          # emits today and any future column padding. Prints NOTHING when the key
          # is absent — callers must treat that as "no answer", never as "no
          # change".
          rev_of () { # <repo-dir-name> <file>
            awk -v k="$1" '$1 == k { print $2; exit }' "$2"
          }

          # 0 healthy | 1 still starting | 2 definitely broken | 3 absent
          #
          # `Created` is 2. It used to fall through to the catch-all and be read as
          # "still starting", which is wrong in both directions: a created
          # container has never been started, so no amount of waiting turns it
          # healthy, and `wait_healthy` spent its whole HEALTH_TIMEOUT on it before
          # giving up. `up -d` starts what it creates, so a service still sitting
          # in `Created` after `update` returned 0 is a service that could not be
          # started.
          #
          # THE THREE NO-DURATION STATES — Restarting, Exited, Created — ARE
          # RECOGNISED, NOT UNREADABLE, and that distinction is load-bearing in
          # `assert_recreated`. "It has no uptime because it is not up" is an
          # observation. "I do not understand this line" is not. Reporting the
          # first as the second is how a crash-looping deploy came to be announced
          # as a deploy that never happened.
          svc_verdict () {
            local line
            line="$(svc_line "$1" "$2")"
            if [ -z "$line" ]; then return 3; fi
            case "$line" in
              *"(unhealthy)"*)                return 2 ;;
              *Restarting*|*restarting*)      return 2 ;;
              *Exit*|*exited*|*Dead*|*dead*)  return 2 ;;
              *Created*|*created*)            return 2 ;;
              *"(healthy)"*)                  return 0 ;;
              *"health: starting"*)           return 1 ;;
              *Up*|*running*)                 return 0 ;;   # no HEALTHCHECK declared
              *)                              return 1 ;;
            esac
          }

          # Docker's HumanDuration vocabulary, IN FULL, converted to seconds.
          # Prints nothing and returns 1 when the line carries no duration this
          # understands; callers must treat that as "no answer" and fail closed.
          #
          #     Less than a second | 1 second | N seconds | About a minute |
          #     N minutes | About an hour | N hours | N days | N weeks |
          #     N months | N years
          #
          # Completeness is the point. `Up About an hour` — docker's wording for a
          # container between 60 and 90 minutes old — was NOT in the previous
          # regex, and `rd-deploy status` on the live box prints it today:
          #
          #     backend<TAB>Up 32 hours (healthy)
          #     dashboard<TAB>Up About an hour (healthy)
          #     python<TAB>Up 46 hours (healthy)
          #     valkey<TAB>Up 46 hours (healthy)
          #
          # `N years` was missing too. Every unlisted wording used to land in a
          # branch that switched the recreation proof off and returned success.
          uptime_secs () { # <a line from `rd-deploy status`>
            local l="${1:-}" n u
            case "$l" in
              *"Up Less than a second"*) printf '%s\n' 0    ; return 0 ;;
              *"Up About a minute"*)     printf '%s\n' 60   ; return 0 ;;
              *"Up About an hour"*)      printf '%s\n' 3600 ; return 0 ;;
            esac
            n="$(printf '%s' "$l" | sed -nE 's/.*Up ([0-9]+) (second|minute|hour|day|week|month|year)s?.*/\1/p')"
            u="$(printf '%s' "$l" | sed -nE 's/.*Up [0-9]+ (second|minute|hour|day|week|month|year)s?.*/\1/p')"
            [ -n "$n" ] && [ -n "$u" ] || return 1
            case "$u" in
              second) printf '%s\n' "$n" ;;
              minute) printf '%s\n' "$(( n * 60 ))" ;;
              hour)   printf '%s\n' "$(( n * 3600 ))" ;;
              day)    printf '%s\n' "$(( n * 86400 ))" ;;
              week)   printf '%s\n' "$(( n * 604800 ))" ;;
              month)  printf '%s\n' "$(( n * 2592000 ))" ;;
              year)   printf '%s\n' "$(( n * 31536000 ))" ;;
              *)      return 1 ;;
            esac
          }

          # The wrapper's TWO rollback outcomes, matched on the sentences it
          # actually prints (deploy/vps/WRAPPER_CONTRACT.md, `rollback`):
          #
          #   restored restaurant-dash-<svc>:previous
          #   WARNING: no previous image for '<svc>' — recreating the CURRENT image, code is NOT reverted
          #
          # The detector these replace was `grep -i warn` AND `grep -iE
          # 'previous|not revert'`. BOTH halves are satisfied by a rollback that
          # WORKED: docker compose v2 prints `WARN[0000] ...` on essentially every
          # invocation, and the success sentence contains the word "previous". So a
          # rollback that had genuinely restored the previous image and brought
          # production back was reported as exit 74, "the code was NOT reverted".
          #
          # THAT FALSE POSITIVE IS THE LIKELY DIRECTION, not the false negative:
          # every service that has ever been through `update` on this box HAS a
          # :previous image, so the successful rollback is the common case and the
          # old detector fired on all of them. The false negative — a genuinely
          # absent :previous going unnoticed — needs someone to reword the wrapper
          # first, and the captured output is in the summary either way.
          #
          # Deliberately case-SENSITIVE so `WARN[0000]` cannot match, and matched on
          # ASCII-only fragments so the em dash in the wrapper's sentence cannot
          # break this on a differently-encoded capture.
          noprev_warned () { # <capture-file>
            grep -qE 'no previous image for|code is NOT reverted' "$1"
          }
          restored_previous () { # <capture-file> <svc>
            grep -qF "restored restaurant-dash-$2:previous" "$1"
          }

          wait_healthy () {
            local deadline=$(( SECONDS + HEALTH_TIMEOUT )) svc rc all_ok src
            # Whether the LAST `rd status` this function ran produced a REAL
            # snapshot. status.txt is read as evidence after this returns, and a
            # FAILED capture holds ssh's error text rather than the wrapper's
            # output — parsing that as a status listing gives every service
            # verdict 3 and lets a summary describe services nobody looked at.
            # Global on purpose: the callers need it.
            HEALTH_LAST_OK=0
            while [ "$SECONDS" -lt "$deadline" ]; do
              rd status > status.txt 2>&1; src=$?
              if [ "$src" -ne 0 ]; then
                # 127 is the login shell, not the wrapper. Retrying for
                # HEALTH_TIMEOUT seconds cannot make an absent forced command
                # appear, and burning the whole budget on it hides the cause
                # behind a "did not become healthy" timeout.
                if [ "$src" -eq 127 ]; then
                  echo "  'status' came back 127 (command not found): the forced command is not in place, so polling can never succeed. Not retrying."
                  sed -n '1,40p' status.txt
                  return 1
                fi
                echo "  (status call failed with $src; retrying)"
                sleep "$HEALTH_INTERVAL"; continue
              fi
              HEALTH_LAST_OK=1
              all_ok=1
              for svc in "$@"; do
                svc_verdict "$svc" status.txt; rc=$?
                case "$rc" in
                  0) ;;
                  2) echo "  service '$svc' is broken:"; sed -n '1,40p' status.txt; return 1 ;;
                  3) echo "  service '$svc' is not in 'status' at all:"; sed -n '1,40p' status.txt; return 1 ;;
                  *) all_ok=0 ;;
                esac
              done
              if [ "$all_ok" -eq 1 ]; then return 0; fi
              sleep "$HEALTH_INTERVAL"
            done
            echo "  services did not become healthy within ${HEALTH_TIMEOUT}s:"
            sed -n '1,40p' status.txt
            return 1
          }

          # THE RECREATION PROOF, derived from CHANGE and never from absolute age.
          #
          # It takes TWO snapshots: `rd-deploy status` from before the first
          # `update`, and `rd-deploy status` from after the last one. A container
          # that was not replaced can only get OLDER between them; one that WAS
          # replaced starts again from zero. The signal is the RESET, which is
          # immune both to a slow build and to whatever wording docker picks.
          #
          # What it replaces: "the container must report an uptime of five minutes
          # or less". That is an absolute age, and it was measured AFTER
          # `update backend` returned — while `update` runs `tsc` and a docker
          # build on 2 vCPUs next to live traffic, which is exactly why this file
          # sets `timeout-minutes: 60`. A build that took six minutes red-lighted a
          # deploy that had worked.
          #
          # FOUR ANSWERS. The previous version had two, and folding the third into
          # "not recreated" shipped a worse bug than the one that fold fixed: a
          # container CRASH-LOOPING on the new image scored "not recreated", hit
          # the exit-72 gate ahead of the health and rollback section, and produced
          # a run with rollback_calls=0, no logs collected, and a summary stating
          # that no new image had reached production — while production was
          # crash-looping on the commit just shipped.
          #
          #   0  RECREATED. The uptime reset — or the service was not up before and
          #      is up now, which is a start rather than a survivor.
          #   1  MEASURED NOT RECREATED. Both readings parsed and the uptime did
          #      not reset. THE ONLY ANSWER that entitles a caller to say the image
          #      was not replaced.
          #   2  REPLACED AND BROKEN. The after line is a RECOGNISED not-running
          #      state — Restarting, Exited, Created, Dead. It carries no duration
          #      because it is not up. The caller must route this into the
          #      health-failure path: collect logs, roll the image back, verify.
          #   3  CANNOT BE TOLD. The service is absent from the after snapshot, or
          #      its line is in a format neither uptime_secs nor svc_verdict
          #      recognises. Fails closed, and the caller must say "I could not
          #      measure" — never "nothing changed".
          #
          # An assertion that opts itself out when it cannot see is not an
          # assertion. An assertion that files a recognised failure under "cannot
          # read" is worse, because it sounds like nothing happened.
          assert_recreated () { # <svc> <status-BEFORE-file> <status-AFTER-file>
            local svc="$1" b a bs as vrc
            b="$(svc_line "$svc" "$2")"
            a="$(svc_line "$svc" "$3")"
            if [ -z "$a" ]; then
              echo "::error::service '$svc' does not appear in 'rd-deploy status' after the update at all, so nothing about it can be proven — neither that it was recreated nor that it was left alone."
              return 3
            fi
            as="$(uptime_secs "$a")" || as=""
            if [ -z "$as" ]; then
              svc_verdict "$svc" "$3"; vrc=$?
              if [ "$vrc" -eq 2 ]; then
                # RECOGNISED, NOT UNREADABLE. Restarting / Exited / Created / Dead
                # carry no duration for the same reason they are broken: nothing is
                # up to have been up for a while.
                echo "::error::service '$svc' is '$a' after the update — a RECOGNISED not-running state. It carries no uptime because it is not running, which is an observation and not a parse failure. Treated as REPLACED AND BROKEN: logs get collected and the image gets rolled back."
                return 2
              fi
              # FAIL CLOSED, and only here. The branch this replaces printed a
              # ::warning:: and `return 0` — one unrecognised duration silently
              # switched half the proof off and the run went green. `Up About an
              # hour` is on the box right now, so that was live, not theoretical.
              echo "::error::could not read an uptime for '$svc' out of 'rd-deploy status' (line: '$a'), and svc_verdict does not recognise the state either. The recreation proof cannot run, so it fails closed — this run does NOT know whether '$svc' was replaced. Fix uptime_secs()/svc_verdict() and re-capture deploy/vps/tests/fixtures/."
              return 3
            fi
            bs="$(uptime_secs "$b")" || bs=""
            if [ -z "$bs" ]; then
              # The AFTER line parsed, so the vocabulary is understood and this is
              # not a format change: the BEFORE line simply was not an "Up ..."
              # line — the service was absent, Restarting, Exited or Created. It
              # was not running before and is running now, which is a start, not a
              # survivor. Refusing here would red-light the deploy that FIXES a
              # crash-looping service, which is the deploy that matters most.
              return 0
            fi
            if [ "$as" -lt "$bs" ]; then return 0; fi
            echo "::error::service '$svc' was NOT recreated by this deploy: its uptime did not reset (before '$b' = ${bs}s, after '$a' = ${as}s). A container that is not replaced can only get older."
            return 1
          }

          # Public probe through the real ingress. Retried, because one curl from a
          # GitHub runner is not evidence of an outage.
          wait_public () { # <url>
            local deadline=$(( SECONDS + PUBLIC_TIMEOUT )) code
            while [ "$SECONDS" -lt "$deadline" ]; do
              code="$(curl -sS -o public-body.txt -w '%{http_code}' --max-time 15 "$1" 2>public-err.txt)"
              case "${code:-000}" in
                2*) echo "  $1 -> $code"; return 0 ;;
              esac
              echo "  $1 -> ${code:-no response} (retrying)"
              [ -s public-err.txt ] && sed -n '1,2p' public-err.txt
              sleep "$PUBLIC_INTERVAL"
            done
            return 1
          }

          # =====================================================================
          # 0. BASELINE. Read the deployed revision BEFORE anything moves. It is
          #    half of the proof at the end, and the only way to tell "the box was
          #    already on this commit" from "the update did nothing".
          # =====================================================================
          echo "== rd-deploy revision (before)"
          rd revision > rev-before.txt 2>&1
          rrc=$?
          cat rev-before.txt
          case "$rrc" in
            0) ;;
            255)
              summary "### SSH transport failure"; block rev-before.txt
              fail 1 "could not reach $DEPLOY_USER@$DEPLOY_HOST:$PORT (ssh exit 255 — a transport failure, NOT a wrapper code). Nothing was deployed and the box was not modified."
              ;;
            127)
              not_installed "revision"
              summary "What came back instead:"; block rev-before.txt
              fail 127 "EXIT 127 = COMMAND NOT FOUND — not a wrapper code and NOT a pending migration. The SSH forced command (/usr/local/sbin/rd-entry) did not run, so 'revision' was executed as a shell command. The wrapper was never reached and nothing was changed. This is a change to the security boundary, not an unfinished install — see the job summary."
              ;;
            64)
              grammar_bug "revision" rev-before.txt
              ;;
            *)
              summary "### 'rd-deploy revision' exited $rrc"; block rev-before.txt
              fail "$rrc" "'rd-deploy revision' exited $rrc before anything was deployed. Nothing was changed on the box. Its output is in the job summary."
              ;;
          esac

          BEFORE_REV="$(rev_of "$REVISION_KEY" rev-before.txt)"
          if ! printf '%s' "$BEFORE_REV" | grep -qE '^[0-9a-f]{40}$'; then
            # Fail CLOSED. Half of the "did this actually ship" proof is missing,
            # and a deploy that cannot be proven is exactly what this design
            # refuses to report as success.
            summary "## Refusing to deploy — cannot read the deployed revision"
            summary ""
            summary "\`rd-deploy revision\` returned 0 but no 40-character SHA could be read for"
            summary "\`$REVISION_KEY\`. This workflow proves a deploy happened by comparing that value"
            summary "to \`github.sha\`; without it a green run would mean nothing."
            summary ""
            summary "Expected one line per repo, \`<repo-dir><TAB><40-char sha>\`. What came back:"
            block rev-before.txt
            summary "Either the wrapper's output format changed, or the clone directory is no longer"
            summary "named \`$REVISION_KEY\` (workflow env \`REVISION_KEY\`, this file). Nothing was"
            summary "deployed and the box was not modified."
            fail 72 "Could not read the deployed revision for '$REVISION_KEY' — refusing to deploy blind. Nothing was changed on the box. Either 'rd-deploy revision' changed format or REVISION_KEY no longer matches the clone directory. See the job summary."
          fi
          echo "deployed revision before this run: $BEFORE_REV"
          echo "this run is deploying:            $GIT_SHA"

          # =====================================================================
          # 1. BASELINE STATUS SNAPSHOT. This is LOAD-BEARING now, not a nicety.
          #
          #    The recreation proof in step 4 is a COMPARISON: it reads each
          #    service's uptime here, before anything moves, and again after the
          #    updates, and looks for the RESET. Without this snapshot there is
          #    nothing to compare against, so the deploy could not be proven — and
          #    a failure to take it refuses the run HERE, while the box is still
          #    completely untouched. That is strictly better than discovering it
          #    after `update` has rebuilt and swapped live containers.
          #
          #    It is still NOT a health gate. Refusing to deploy the backend
          #    because the backend is unhealthy would block the fix. The health
          #    verdicts are only recorded, so that a post-deploy health failure can
          #    say whether the service was already sick before this run started.
          # =====================================================================
          echo "== rd-deploy status (baseline snapshot — half of the recreation proof)"
          rd status > pre.txt 2>&1
          src=$?
          cat pre.txt
          case "$src" in
            0) ;;
            255)
              summary "### SSH transport failure"; block pre.txt
              fail 1 "could not reach $DEPLOY_USER@$DEPLOY_HOST:$PORT (ssh exit 255 — a transport failure, NOT a wrapper code). Nothing was deployed and the box was not modified."
              ;;
            127)
              not_installed "status"
              summary "What came back instead:"; block pre.txt
              fail 127 "EXIT 127 = COMMAND NOT FOUND — not a wrapper code. The SSH forced command did not run, so 'status' was executed as a shell command. Nothing was inspected and nothing was changed. See the job summary."
              ;;
            64)
              grammar_bug "status" pre.txt
              ;;
            *)
              summary "## Refusing to deploy — the baseline status snapshot could not be taken"
              summary ""
              summary "\`rd-deploy status\` exited $src **before anything was touched**. That snapshot is"
              summary "half of the recreation proof: this run decides that a container was replaced by"
              summary "comparing each service's uptime before the update with its uptime after, and"
              summary "looking for the reset. With no *before*, there is nothing to compare — and a"
              summary "deploy that cannot be proven is precisely what this pipeline refuses to report"
              summary "as success."
              summary ""
              summary "What came back:"
              block pre.txt
              summary "Nothing was deployed. The working tree, the containers and the database are all"
              summary "exactly as they were."
              fail 72 "Could not take the baseline 'rd-deploy status' snapshot (exit $src) — refusing to deploy blind. That snapshot is half of the recreation proof. Nothing was changed on the box."
              ;;
          esac
          PRE_SICK=0
          for s in python backend; do
            svc_verdict "$s" pre.txt || PRE_SICK=1
          done
          if [ "$PRE_SICK" -eq 1 ]; then
            echo "::warning::at least one of python/backend was ALREADY not healthy before this deploy started."
          fi

          # =====================================================================
          # 2. Ask the server for the migration state BEFORE the tree moves.
          #    `check-migrations` applies nothing — that is the whole point.
          #
          #    It sees the migration set of the commit the box is CURRENTLY on, so
          #    it catches an unapplied migration left over from an EARLIER release.
          #    A migration added by THIS commit is not on the box yet; that one is
          #    caught by the gate inside `update`. Catching it here is strictly
          #    better when it fires, because the working tree has not moved.
          # =====================================================================
          echo "== rd-deploy check-migrations"
          rd check-migrations > migrations.txt 2>&1
          mrc=$?
          cat migrations.txt
          case "$mrc" in
            0) ;;
            255)
              summary "### SSH transport failure"; block migrations.txt
              fail 1 "could not reach $DEPLOY_USER@$DEPLOY_HOST:$PORT (ssh exit 255). Nothing was deployed and the box was not modified."
              ;;
            127)
              # MUST stay above the generic branch below, which announces a PENDING
              # MIGRATION. 127 means the question was never asked.
              not_installed "check-migrations"
              summary "What came back instead:"; block migrations.txt
              fail 127 "EXIT 127 = COMMAND NOT FOUND — NOT a pending migration. The forced command did not run, so 'check-migrations' was executed as a shell command. Nothing is known about migrations from this run and nothing was changed. See the job summary."
              ;;
            64)
              grammar_bug "check-migrations" migrations.txt
              ;;
            *)
              summary "## Deploy refused — the database has pending migration(s)"
              summary ""
              summary "\`rd-deploy check-migrations\` exited $mrc **before anything was touched**, which"
              summary "means the pending migration is left over from an earlier release: the box is"
              summary "still on \`$BEFORE_REV\` and this commit has not been fetched."
              summary ""
              summary "Its output:"
              block migrations.txt
              summary "Nothing was deployed. The working tree, the containers and the database are all"
              summary "exactly as they were."
              summary ""
              summary "Apply it as root on the VPS — see \`deploy/vps/README.md\`, *Applying a"
              summary "migration* — confirm \`check-migrations\` comes back clean, then re-run this"
              summary "workflow from the Actions tab."
              fail "$mrc" "PENDING MIGRATION from an EARLIER release (check-migrations exited $mrc before the tree was touched). Nothing was deployed and nothing on the box changed. The names are in the job summary; apply them as root on the VPS, then re-run this workflow."
              ;;
          esac

          # =====================================================================
          # 3. UPDATE. python FIRST, then backend.
          #
          #    Both services come out of the SAME clone and the SAME working tree,
          #    so the first `update` is the one that fetches and resets; the second
          #    finds the tree already at FETCH_HEAD and only rebuilds its own
          #    service.
          #
          #    WHY python FIRST:
          #      * the first `update` is the one that can be REFUSED (65, or 64 on
          #        a grammar bug). Spending that refusal on the sidecar means the
          #        API every till talks to has not been rebuilt or bounced when it
          #        happens.
          #      * backend depends on python, not the other way round. Bringing the
          #        dependency up first means the new backend never talks to an old
          #        sidecar. The only inconsistent window is old-backend/new-python,
          #        which is the direction the expand/contract discipline already
          #        covers.
          #      * backend is the publicly observable service (/health) and the one
          #        the dashboard proxies to. Going last means the riskiest swap is
          #        the one the health poll immediately below is watching.
          #      * if the python build fails, the backend has not been touched at
          #        all and restaurants keep taking orders.
          #
          #    Unlike the registry version, python is NOT skipped when nothing about
          #    it changed: there is no digest to compare before the build exists. A
          #    skip would have to be inferred from a path diff against the box's
          #    previous SHA, which is not guaranteed to be an ancestor of this
          #    commit after a force-push or a squash. A no-change rebuild is a cache
          #    hit and one restart.
          #
          #    If someone pushes to main between these two calls, the second
          #    `update` fetches THAT commit and the two services end up built from
          #    different trees. The revision assertion in step 4 catches it.
          # =====================================================================
          UPDATED=()
          for svc in python backend; do
            echo "== rd-deploy update $svc"
            rd update "$svc" > "update-$svc.txt" 2>&1
            urc=$?
            cat "update-$svc.txt"
            if [ "$urc" -eq 0 ]; then
              UPDATED+=("$svc")
              continue
            fi

            DONE_SO_FAR="none"
            [ "${#UPDATED[@]}" -gt 0 ] && DONE_SO_FAR="${UPDATED[*]}"
            HALF="Nothing was updated before this failure."
            [ "${#UPDATED[@]}" -gt 0 ] && HALF="PRODUCTION IS NOW HALF-DEPLOYED: a NEW ${UPDATED[*]} against the OLD $svc, and the working tree on the box is already at $GIT_SHA, so the next 'update' of any service in this repo rebuilds this same commit. Consider 'sudo rd-deploy rollback ${UPDATED[*]}'."

            case "$urc" in
              127)
                not_installed "update $svc"
                summary "What came back instead:"; block "update-$svc.txt"
                half_deployed "$svc"
                fail 127 "EXIT 127 = COMMAND NOT FOUND — NOT a pending migration and NOT a wrapper refusal. The SSH forced command did not run. $HALF See the job summary."
                ;;
              64)
                grammar_bug "update $svc" "update-$svc.txt"
                ;;
              65)
                migration_refused "$svc" "update-$svc.txt"
                ;;
              255)
                summary "### SSH transport failure during \`update $svc\`"
                block "update-$svc.txt"
                half_deployed "$svc"
                summary "> On top of the state above, \`$svc\` itself is **unknown**: the build keeps"
                summary "> running on the box after the connection drops, so it may have completed."
                summary ""
                fail 1 "SSH transport failure (255) during 'update $svc'. THE STATE IS UNKNOWN: the update may have completed on the box after the connection dropped, because the build keeps running. Do not re-run blind — check 'sudo rd-deploy revision' and 'sudo rd-deploy status' on the box first. $HALF"
                ;;
              *)
                summary "### \`rd-deploy update $svc\` failed — exit $urc"
                block "update-$svc.txt"
                summary "The most likely cause is the build itself: the box compiles its own deploys"
                summary "now, so a \`tsc\` error, a missing build dependency or an out-of-memory kill"
                summary "during \`docker compose build\` all land here. The build output is above."
                summary ""
                half_deployed "$svc"
                fail "$urc" "'rd-deploy update $svc' exited $urc — most likely the build failed on the box. $HALF The captured build output is in the job summary."
                ;;
            esac
          done

          # =====================================================================
          # 4. PROVE IT. Two independent signals; a green run needs both.
          # =====================================================================
          echo "== rd-deploy revision (after)"
          rd revision > rev-after.txt 2>&1
          rrc=$?
          cat rev-after.txt

          # THIS CALL GETS THE SAME EXIT-CODE CASES AS EVERY OTHER ONE. It had
          # none: any non-zero simply left AFTER_REV empty, REV_OK went to 0, and
          # the summary then announced "the deployed revision is not this commit —
          # either something pushed to `main` while this run was in flight, or
          # `update` did not reset the working tree". A 127 says neither of those
          # things. It says the forced command is gone and the question was never
          # answered.
          #
          # Unlike the BASELINE revision call, a failure here does NOT abort.
          # `update` has already rebuilt and swapped live containers by this point,
          # so the health poll and the rollback path are the parts that matter;
          # dying here to report a bookkeeping failure would skip both. The code is
          # recorded, REV_READ stays 0, and every summary that mentions the
          # revision says it could not be read rather than inventing a reason.
          AFTER_REV=""
          REV_READ=0
          REV_RC="$rrc"
          case "$rrc" in
            0)
              AFTER_REV="$(rev_of "$REVISION_KEY" rev-after.txt)"
              if [ -n "$AFTER_REV" ]; then
                REV_READ=1
              else
                echo "::error::'rd-deploy revision' returned 0 after the update but carried no line for '$REVISION_KEY', so the deployed revision is unknown."
              fi
              ;;
            127)
              echo "::error::'rd-deploy revision' came back 127 AFTER the update: the SSH forced command is not in place, so the deployed revision was never read. Treat it as a security event, not a deploy failure."
              not_installed "revision"
              summary "What came back instead:"; block rev-after.txt
              ;;
            64)
              echo "::error::'rd-deploy revision' came back 64 after the update — the grammar refused a sentence this workflow sent. That is a pipeline bug, and the deployed revision was never read."
              ;;
            255)
              echo "::error::'rd-deploy revision' came back 255 after the update — an ssh TRANSPORT failure, not a wrapper code. The deployed revision was never read."
              ;;
            *)
              echo "::error::'rd-deploy revision' exited $rrc after the update, so the deployed revision was never read."
              ;;
          esac
          REV_OK=0
          if [ "$REV_READ" -eq 1 ] && [ "$AFTER_REV" = "$GIT_SHA" ]; then REV_OK=1; fi

          # Did the revision MOVE? Nothing used to ask. A re-dispatch of a commit
          # the box is already on prints "aaaa -> aaaa (= github.sha)" and reports
          # success on a run that changed nothing at all. REV_OK says the deployed
          # code IS this commit; REV_MOVED says this run is what put it there.
          # Both are false when the revision could not be read: "not observed" is
          # never "no".
          REV_MOVED=0
          if [ "$REV_READ" -eq 1 ] && [ "$AFTER_REV" != "$BEFORE_REV" ]; then REV_MOVED=1; fi

          echo "== rd-deploy status (after)"
          rd status > status0.txt 2>&1
          src=$?
          cat status0.txt
          STATUS_AFTER_OK=0
          STATUS_AFTER_RC="$src"
          if [ "$src" -eq 0 ]; then STATUS_AFTER_OK=1; fi

          # RECREATION, by comparing pre.txt (taken before the first `update`) with
          # status0.txt. AT LEAST ONE updated service must show the reset.
          #
          # FOUR BUCKETS. Every collapse of two of them has shipped a bug:
          #
          #   RECREATED   the uptime reset. A new container is running.
          #   UNCHANGED   MEASURED not recreated: both readings parsed, no reset.
          #               The ONLY bucket that entitles a summary to say the image
          #               was not replaced.
          #   BROKEN      the after snapshot shows Restarting / Exited / Created —
          #               a recognised NOT-RUNNING state. Replaced and broken. Goes
          #               down the health-failure path (logs, rollback, re-verify)
          #               and NEVER into the exit-72 gate. Putting it there is what
          #               made a crash-looping deploy exit 72 with rollback_calls=0,
          #               no logs, and a summary insisting no new image had reached
          #               production.
          #   UNMEASURED  could not be told: the `status` call itself failed, the
          #               service is absent from the output, or its line is in a
          #               format nothing here recognises. "I could not measure" is
          #               not "I measured no change", and they get different
          #               summaries and different ::error:: lines.
          RECREATED=()
          UNCHANGED=()
          BROKEN=()
          UNMEASURED=()
          if [ "$STATUS_AFTER_OK" -eq 0 ]; then
            echo "::error::'rd-deploy status' exited $src after the update, so the recreation proof could not run for ANY service. That is not the same as measuring that nothing was recreated, and no summary from this run may say it is."
            UNMEASURED=("${UPDATED[@]}")
          else
            for s in "${UPDATED[@]}"; do
              assert_recreated "$s" pre.txt status0.txt; arc=$?
              case "$arc" in
                0) RECREATED+=("$s") ;;
                1) UNCHANGED+=("$s") ;;
                2) BROKEN+=("$s") ;;
                *) UNMEASURED+=("$s") ;;
              esac
            done
          fi
          RECREATED_OK=0
          if [ "${#RECREATED[@]}" -gt 0 ]; then RECREATED_OK=1; fi
          if [ "$RECREATED_OK" -eq 1 ] && [ "${#UNCHANGED[@]}" -gt 0 ]; then
            echo "::notice::${UNCHANGED[*]} was NOT recreated: its uptime did not reset, so compose had nothing to swap for it. That is not a failure — this pipeline requires at least one updated service to show the reset, and ${RECREATED[*]} did."
          fi

          HEALTHY=0
          if wait_healthy "${UPDATED[@]}"; then HEALTHY=1; fi

          # THE SECOND DOOR INTO THE SAME TRAP. When the post-update `status` call
          # fails, every service lands in UNMEASURED — and a crash-looping service
          # would then reach the exit-72 gate with no logs and no rollback, which is
          # exactly what the BROKEN bucket exists to prevent. `wait_healthy` takes
          # its own snapshots; if its LAST one was a real capture and it shows an
          # updated service in a recognised broken state, that is an observation and
          # it counts.
          #
          # ONLY UNMEASURED services are reclassified. A service MEASURED as not
          # recreated and then seen unhealthy is the OLD container going sick, and
          # rolling that back would move production backwards over a deploy that
          # never happened.
          BROKEN_LATE=()
          if [ "${#UNMEASURED[@]}" -gt 0 ] && [ "${HEALTH_LAST_OK:-0}" -eq 1 ]; then
            for s in "${UNMEASURED[@]}"; do
              # assert_recreated, NOT svc_verdict. svc_verdict answers "is this
              # line broken?" and says yes to any (unhealthy), whatever its
              # uptime — so a service that was ALREADY sick before this run, seen
              # through one flaky status call, would be force-recreated by a run
              # that shipped nothing. assert_recreated only returns 2 when the
              # uptime ALSO reset, i.e. this run really did put that image there.
              assert_recreated "$s" pre.txt status.txt; vrc=$?
              if [ "$vrc" -eq 2 ]; then
                BROKEN_LATE+=("$s")
                echo "::error::the recreation proof could not run for '$s', but the health poll DID observe it broken: '$(svc_line "$s" status.txt)'. Logs will be collected and the image rolled back."
              fi
            done
          fi

          # POSITIVE EVIDENCE that a new image reached production: at least one
          # service whose uptime reset, or at least one sitting in a not-running
          # state. Without it `rollback` must not run — it would swap the running
          # image for the build BEFORE the one running now.
          REPLACED_OK=0
          if [ "${#RECREATED[@]}" -gt 0 ] || [ "${#BROKEN[@]}" -gt 0 ] || [ "${#BROKEN_LATE[@]}" -gt 0 ]; then REPLACED_OK=1; fi

          # PUBLIC_OK IS THREE-VALUED, because "not probed" is not "answering". It
          # defaulted to 1 while the probe itself is gated on HEALTHY=1, so every
          # run that never got healthy printed `probe answering` in its summary
          # with ZERO curl calls made — a reported observation that was never made.
          #
          #   1 = probed, answered 2xx     0 = probed, never answered
          #   2 = NOT probed, and PUBLIC_WHY says why
          PUBLIC_OK=2
          PUBLIC_WHY="no PUBLIC_HEALTH_URL is configured for this workflow, so nothing was probed"
          if [ -n "${PUBLIC_HEALTH_URL:-}" ]; then
            if [ "$HEALTHY" -eq 1 ]; then
              PUBLIC_OK=1
              echo "== public probe $PUBLIC_HEALTH_URL"
              if wait_public "$PUBLIC_HEALTH_URL"; then
                head -c 400 public-body.txt; echo
                # WHAT /health REALLY RETURNS (routes/misc.ts): 200 with
                #   {"status":"ok","uptime":..,"database":{"ok":true,..},"realtime":{..}}
                # and, when the database is down, 503 with "status":"degraded".
                #
                # The check here used to grep for `"ok": true`. The route emits no
                # such top-level field — it only ever matched the NESTED
                # `database.ok`, and the degraded case it was written to catch
                # returns 503, which `wait_public` never accepts, so this line was
                # unreachable for it. Dead code that looked alive.
                #
                # What is worth asserting about a 2xx is that it came from THIS
                # application at all: an ingress splash page, a cached error page or
                # a differently-routed app can all answer 200 on this URL while the
                # backend is unreachable. `"status":"ok"` is what only this endpoint
                # emits. Still a warning, not a rollback: an image swap cannot fix
                # what is in front of the container.
                if ! grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' public-body.txt; then
                  echo "::warning::$PUBLIC_HEALTH_URL answered 2xx but the body is not this backend's /health payload (no \"status\":\"ok\"). Something else is answering on that URL — an ingress splash page, a cached error page, or a different app. The containers are healthy on the box, so this is not rolled back; check the tunnel/ingress and DNS."
                fi
              else
                PUBLIC_OK=0
              fi
            else
              PUBLIC_WHY="the containers never came back healthy on the box, so there was nothing to probe"
            fi
          fi

          # ONE place turns the tri-state into words, so no summary can invent a
          # fourth meaning for it.
          public_word () {
            case "$PUBLIC_OK" in
              1) printf '%s\n' "answering" ;;
              0) printf '%s\n' "NOT answering" ;;
              *) printf '%s\n' "not probed — $PUBLIC_WHY" ;;
            esac
          }

          echo "proof: revision_read=$REV_READ revision_ok=$REV_OK revision_moved=$REV_MOVED recreated_ok=$RECREATED_OK replaced_ok=$REPLACED_OK healthy=$HEALTHY public_ok=$PUBLIC_OK"
          echo "       recreated=[${RECREATED[*]:-<none>}] measured-not-recreated=[${UNCHANGED[*]:-<none>}]"
          echo "       replaced-and-broken=[${BROKEN[*]:-<none>}] broken-per-health-poll=[${BROKEN_LATE[*]:-<none>}] could-not-measure=[${UNMEASURED[*]:-<none>}]"

          # ---- success --------------------------------------------------------
          # REPLACED_OK, not RECREATED_OK: a service that was Restarting in the
          # snapshot taken straight after the update and healthy by the end of the
          # poll WAS replaced, and one that restarted once before settling is not a
          # reason to red-light a deploy. PUBLIC_OK -ne 0 accepts both "probed and
          # answering" and "not probed"; only a probe that RAN and FAILED blocks.
          # A commit that lands in NEITHER image is a legitimate success, not a
          # failure. Measured on the first push-triggered run (32650108769): it
          # changed only .github/workflows/deploy.yml, so both builds were full
          # cache hits, nothing was recreated, and the run went red — while the
          # box WAS on the pushed commit and healthy. Every docs/, deploy/ or
          # workflow commit would do the same, and a pipeline that red-lights
          # routine commits teaches people to ignore red, which costs more than
          # it protects.
          #
          # This is narrow on purpose, and is NOT "green means shipped" being
          # weakened. All four must hold: the tree is at github.sha, it MOVED
          # there this run, and EVERY updated service was positively MEASURED as
          # not-recreated on both sides of the update. A service we merely could
          # not measure lands in UNMEASURED, not UNCHANGED, so it can never
          # satisfy this and still exits 72.
          NOOP_OK=0
          if [ "$HEALTHY" -eq 1 ] && [ "$REV_OK" -eq 1 ] && [ "$REV_MOVED" -eq 1 ] \
             && [ "$REPLACED_OK" -eq 0 ] && [ "${#UPDATED[@]}" -gt 0 ] \
             && [ "${#UNCHANGED[@]}" -eq "${#UPDATED[@]}" ] && [ "$PUBLIC_OK" -ne 0 ]; then
            NOOP_OK=1
          fi

          if [ "$HEALTHY" -eq 1 ] && [ "$REV_OK" -eq 1 ] && [ "$NOOP_OK" -eq 1 ] && [ "$PUBLIC_OK" -ne 0 ]; then
            summary "### Production deploy (backend) — OK, nothing to rebuild"
            summary ""
            summary '```'
            summary "revision   ${BEFORE_REV:0:12} -> ${AFTER_REV:0:12}   (= github.sha)"
            summary "rebuilt    <none> — every updated service was a cache hit"
            summary "unchanged  ${UNCHANGED[*]}"
            summary '```'
            summary ""
            summary "The box moved to this commit and every service is healthy, but nothing in"
            summary "it lands in either image — a \`docs/\`, \`deploy/\`, \`.github/\` or otherwise"
            summary "\`.dockerignore\`d change. Each updated service's uptime was read on BOTH"
            summary "sides of the update and had not reset, so this is measured, not assumed."
            summary ""
            summary "Production is running the same images as before this run, and is on the"
            summary "commit you pushed."
            echo "::notice::Deploy OK at $GIT_SHA — nothing to rebuild (${UNCHANGED[*]} were cache hits); containers healthy and the box is on this commit."
            exit 0
          fi

          if [ "$HEALTHY" -eq 1 ] && [ "$REV_OK" -eq 1 ] && [ "$REPLACED_OK" -eq 1 ] && [ "$PUBLIC_OK" -ne 0 ]; then
            summary "### Production deploy (backend) — OK"
            summary ""
            summary '```'
            if [ "$REV_MOVED" -eq 1 ]; then
              summary "revision   ${BEFORE_REV:0:12} -> ${AFTER_REV:0:12}   (= github.sha)"
            else
              summary "revision   ${AFTER_REV:0:12}   UNCHANGED — the box was already on this commit"
            fi
            if [ "${#RECREATED[@]}" -gt 0 ]; then
              summary "recreated  ${RECREATED[*]}   (uptime reset — a new image is running)"
            fi
            if [ "${#BROKEN[@]}" -gt 0 ] || [ "${#BROKEN_LATE[@]}" -gt 0 ]; then
              summary "restarted  ${BROKEN[*]:-}${BROKEN_LATE[*]:+ ${BROKEN_LATE[*]}}   (not running just after the update; healthy by the end of the poll)"
            fi
            if [ "${#UNCHANGED[@]}" -gt 0 ]; then
              summary "unchanged  ${UNCHANGED[*]}   (uptime did not reset — compose had nothing to swap)"
            fi
            summary "probe      $(public_word)${PUBLIC_HEALTH_URL:+   $PUBLIC_HEALTH_URL}"
            summary '```'
            summary ""
            # Say plainly what did and did not change. A summary that lists
            # "services python backend" without distinguishing them invites the
            # reader to assume both were replaced.
            if [ "${#UNCHANGED[@]}" -gt 0 ]; then
              summary "\`${UNCHANGED[*]}\` was **not** replaced: its uptime did not reset, so \`up -d\`"
              summary "found nothing to swap for it. The run is green because this pipeline requires"
              summary "**at least one** updated service to show the reset, not all of them, and"
              summary "\`${RECREATED[*]:-<none>}\` did."
              summary ""
              summary "> Worth a look rather than a shrug, though. **Measured on this box, a rebuild"
              summary "> with no source change still recreates**: buildx stamps a provenance"
              summary "> attestation into every build, so the image id changes and \`up -d\` swaps the"
              summary "> container anyway. An earlier version of this file described \`unchanged\` as"
              summary "> the routine outcome for \`python\`; on this box it is not. If you expected"
              summary "> \`${UNCHANGED[*]}\` to move, read the \`update\` output above."
              summary ""
            fi
            if [ "${#BROKEN[@]}" -gt 0 ] || [ "${#BROKEN_LATE[@]}" -gt 0 ]; then
              summary "\`${BROKEN[*]:-}${BROKEN_LATE[*]:+ ${BROKEN_LATE[*]}}\` was **not running** in the snapshot taken straight after the"
              summary "update — a new container that had not come up yet — and was healthy by the end"
              summary "of the health poll. It shipped and it recovered on its own. If that keeps"
              summary "happening, the container is slower to boot than its HEALTHCHECK start-period"
              summary "allows."
              summary ""
            fi
            if [ "$REV_MOVED" -eq 0 ]; then
              summary "The deployed revision did **not** move: \`/opt/restaurant-dash/$REVISION_KEY\` was"
              summary "already at \`$GIT_SHA\` when this run started. That is the normal shape of a"
              summary "re-run after a migration was applied by hand — the earlier run reset the tree"
              summary "and then refused to build. What this run changed is the running image:"
              summary "\`${RECREATED[*]:-${BROKEN[*]:-}}\`."
              summary ""
            fi
            if [ "$PUBLIC_OK" -eq 2 ]; then
              summary "**No public probe was made** — $PUBLIC_WHY. Nothing in this run observed the"
              summary "service from outside the box."
              summary ""
            fi
            summary "\`rd-deploy status\` after the swap:"
            block status0.txt
            # Name only what this run actually replaced. Offering `rollback python`
            # after a service that was never swapped sends the operator to retag an
            # image that is already what is running, which does nothing and looks
            # like it failed.
            summary "**If this release turns out to be bad**, put the PREVIOUS IMAGE back — backend"
            summary "first, so the API every till talks to is on a known-good build before the"
            summary "sidecar is touched:"
            summary ""
            summary '```sh'
            for s in backend python; do
              case " ${RECREATED[*]:-} ${BROKEN[*]:-} ${BROKEN_LATE[*]:-} " in *" $s "*) summary "sudo /usr/local/sbin/rd-deploy rollback $s" ;; esac
            done
            summary '```'
            summary ""
            summary "That reverts the IMAGE only. The working tree on the box stays at \`$GIT_SHA\`,"
            summary "so the next \`update\` of **either** service rebuilds this commit and ships it"
            summary "again. **Revert the commit on \`main\` as well.**"
            echo "::notice::Deploy succeeded at $GIT_SHA. Recreated: ${RECREATED[*]:-<none>}. Not recreated (uptime did not reset): ${UNCHANGED[*]:-<none>}. Containers healthy; public probe $(public_word)."
            exit 0
          fi

          # ---- shipped and healthy on the box, but not reachable --------------
          # ABOVE the exit-72 gate, because that gate now takes every remaining
          # HEALTHY=1 run. Guarded on PUBLIC_OK -eq 0 — a probe that RAN and never
          # answered — so it can no longer be reached by a run that made no probe
          # at all, and on REV_OK/REPLACED_OK so its opening sentence about what
          # shipped is something this run actually established.
          if [ "$HEALTHY" -eq 1 ] && [ "$PUBLIC_OK" -eq 0 ] && [ "$REV_OK" -eq 1 ] && [ "$REPLACED_OK" -eq 1 ]; then
            summary "### Production deploy (backend) — shipped, but NOT reachable from the internet"
            summary ""
            summary "The containers were replaced at \`$GIT_SHA\` and report healthy on the box, but"
            summary "\`$PUBLIC_HEALTH_URL\` never answered 2xx in ${PUBLIC_TIMEOUT}s. From a"
            summary "restaurant's point of view production is down, so this run is red."
            summary ""
            summary "**Nothing was rolled back, deliberately.** The application is healthy on the"
            summary "box; what is broken is the path between the internet and it, and swapping the"
            summary "image cannot fix that. Rolling back here would add an outage to an outage."
            summary ""
            summary "Check, in this order: the ingress/tunnel service on the box"
            summary "(\`journalctl -u cloudflared\`), then DNS, then TLS. Last curl:"
            block public-err.txt
            summary "\`rd-deploy status\`:"; block status0.txt
            fail 73 "SHIPPED BUT UNREACHABLE. ${RECREATED[*]:-${BROKEN[*]:-${UPDATED[*]}}} was replaced at $GIT_SHA and is healthy on the box, but $PUBLIC_HEALTH_URL never answered 2xx in ${PUBLIC_TIMEOUT}s. NOT rolled back — the containers are fine and an image swap cannot fix ingress. Check the tunnel/ingress first."
          fi

          # ---- could not be proven -------------------------------------------
          # Deliberately ABOVE the rollback section, and deliberately NOT reached
          # when production is broken AND something was observed to have replaced
          # it. The rule it protects is: never roll back what was never rolled
          # forward — `rollback` swaps the running image for `:previous`, so if
          # this run did not replace the image, the thing running IS `:previous`
          # and rolling back moves production to the build before that.
          #
          # THE GATE IS `HEALTHY -eq 1 || REPLACED_OK -eq 0`, and the second half
          # is the fix. It used to be `REV_OK -eq 0 || RECREATED_OK -eq 0`, which
          # swallowed the crash-loop: a service Restarting on the new image scored
          # "not recreated", landed here, and exited 72 with no logs, no rollback,
          # and a summary saying no new image had reached production. Everything
          # that passes this gate now is either healthy (so there is nothing to
          # roll back) or unreplaced (so there is nothing to roll back TO).
          if [ "$HEALTHY" -eq 1 ] || [ "$REPLACED_OK" -eq 0 ]; then

            # ---- the genuine no-op re-dispatch, given its own outcome ---------
            # The revision is right, it did not move because the box was already
            # there, and EVERY updated service was MEASURED as not recreated.
            # Telling the operator "the deploy could not be proven" sends them
            # hunting a fault; the honest answer is that this run had nothing to
            # do. It is still RED, because the one promise this pipeline makes is
            # that a GREEN run means code shipped.
            #
            # `${#UNCHANGED[@]} -eq ${#UPDATED[@]}` is the load-bearing condition,
            # and it is new. The four buckets partition UPDATED, so requiring
            # UNCHANGED to hold all of them is exactly "every service was measured,
            # and every measurement said no change". Without it, a run whose
            # post-update `status` call merely TIMED OUT landed in this branch —
            # and this branch states as fact that every rebuild was a cache hit and
            # that no container's uptime reset, neither of which had been observed.
            if [ "$REV_OK" -eq 1 ] && [ "$REV_MOVED" -eq 0 ] && [ "$RECREATED_OK" -eq 0 ] && [ "${#UNCHANGED[@]}" -eq "${#UPDATED[@]}" ]; then
              summary "### Production deploy (backend) — NOTHING CHANGED"
              summary ""
              summary '```'
              summary "revision   ${AFTER_REV:0:12}   ALREADY this commit before the run started"
              summary "recreated  none of: ${UPDATED[*]}   (measured: every uptime was older than before)"
              summary "healthy    $([ "$HEALTHY" -eq 1 ] && echo yes || echo NO)"
              summary "probe      $(public_word)"
              summary '```'
              summary ""
              summary "**Nothing moved and nothing shipped.** \`/opt/restaurant-dash/$REVISION_KEY\` was"
              summary "already at \`$GIT_SHA\` when this run started, so \`update\` had nothing to fetch,"
              summary "and every updated service's uptime was READ on both sides of the update and had"
              summary "not reset — so \`up -d\` replaced nothing."
              summary ""
              summary "> That is a measurement, not an assumption. If any service's uptime could not"
              summary "> be read, this run would have said so under a different heading."
              summary ""
              summary "This is **not** evidence that something is wrong. It is evidence that this"
              summary "dispatch had nothing to do. It is red anyway, and deliberately: a run that"
              summary "ships nothing must not look the same as one that ships."
              summary ""
              if [ "$HEALTHY" -eq 1 ]; then
                summary "Production is already running \`$GIT_SHA\` and is healthy. If you meant to"
                summary "redeploy an unchanged commit, there is nothing further to do."
              else
                summary "Production is already running \`$GIT_SHA\` and is **NOT healthy** — but this run"
                summary "did not cause that and did not change anything. Investigate the running"
                summary "service; do not expect another dispatch to fix it, because another dispatch"
                summary "will also do nothing."
              fi
              summary ""
              summary "If you expected this dispatch to change something, then the commit you"
              summary "dispatched is not the commit you think it is: check that \`main\` carries your"
              summary "change and that \`$GIT_SHA\` is it. Note also that on this box a rebuild with no"
              summary "source change normally DOES recreate the container — buildx stamps a new image"
              summary "id into every build — so no container moving is itself worth a look."
              summary ""
              summary "**No rollback was attempted.** Every updated service was measured as not"
              summary "replaced, so the image running now IS \`:previous\`'s successor and there is"
              summary "nothing to roll back to but the build before it."
              summary ""
              summary "\`rd-deploy status\`:"; block status0.txt
              fail 72 "NOTHING CHANGED — this dispatch was a no-op. The box was ALREADY at $GIT_SHA before the run started, the revision did not move, and every updated service's uptime was read on both sides of the update and had not reset. Nothing shipped, so the run is red: on this pipeline a green run means code shipped. Production is unchanged and nothing was rolled back."
            fi

            # ---- could not MEASURE, which is not the same as measured no ------
            # A separate outcome on purpose. "Measured not recreated" and "could
            # not measure" used to share the NOTHING CHANGED summary, which states
            # as fact that every rebuild was a cache hit and that no container's
            # uptime reset. In the run that exposed it, `update backend` returned 0
            # and DID recreate the container; only the follow-up `status` timed
            # out. Every sentence below is something this run actually observed.
            if [ "${#UNMEASURED[@]}" -gt 0 ]; then
              summary "### Production deploy (backend) — COULD NOT BE MEASURED"
              summary ""
              summary '```'
              summary "expected (github.sha)      $GIT_SHA"
              summary "revision after this run    ${AFTER_REV:-<could not be read>}"
              summary "revision moved this run    $([ "$REV_READ" -eq 1 ] && { [ "$REV_MOVED" -eq 1 ] && echo yes || echo no; } || echo "unknown — revision could not be read")"
              summary "recreated                  ${RECREATED[*]:-<none>}"
              summary "measured NOT recreated     ${UNCHANGED[*]:-<none>}"
              summary "COULD NOT MEASURE          ${UNMEASURED[*]}"
              summary "containers healthy         $([ "$HEALTHY" -eq 1 ] && echo yes || echo NO)"
              summary "probe                      $(public_word)"
              summary '```'
              summary ""
              summary "**This run does not know whether a new image reached production for"
              summary "\`${UNMEASURED[*]}\`.** That is not a claim that nothing shipped — it is the"
              summary "absence of the measurement that would decide it."
              summary ""
              if [ "$STATUS_AFTER_OK" -eq 0 ]; then
                summary "Why: the post-update \`rd-deploy status\` call itself exited"
                summary "\`$STATUS_AFTER_RC\`, so there is no *after* snapshot to compare the baseline"
                summary "against. \`update\` returned **0** for \`${UPDATED[*]}\` before that, which"
                summary "means the wrapper fetched, built and ran \`up -d\` — the part that is unknown"
                summary "is only whether the container was swapped."
                summary ""
                summary "What came back instead of a status listing:"
                block status0.txt
              else
                summary "Why: \`rd-deploy status\` was read, but the line for each service above could"
                summary "not be turned into an uptime and is not a state \`svc_verdict\` recognises."
                summary "That is a WRAPPER FORMAT CHANGE until proven otherwise — fix"
                summary "\`uptime_secs()\`/\`svc_verdict()\` in this file and re-capture"
                summary "\`deploy/vps/tests/fixtures/\`, then re-run \`deploy/vps/tests/test_status_parser.sh\`."
                summary ""
                summary "\`rd-deploy status\` after the update:"
                block status0.txt
              fi
              if [ "$HEALTHY" -eq 1 ]; then
                summary "**The containers ARE healthy**, which the health poll did observe. So"
                summary "production is up; what is missing is the evidence that this run is what put"
                summary "the current image there."
              else
                summary "**The containers are NOT healthy** either, which the health poll did observe."
                summary "Check them by hand before dispatching anything else."
              fi
              summary ""
              summary "Establish the truth on the box, then decide:"
              summary ""
              summary '```sh'
              summary "sudo /usr/local/sbin/rd-deploy status        # uptimes: seconds = swapped"
              summary "sudo /usr/local/sbin/rd-deploy revision      # should read $GIT_SHA"
              for s in "${UNMEASURED[@]}"; do
                summary "sudo /usr/local/sbin/rd-deploy logs $s"
              done
              summary '```'
              summary ""
              summary "**No rollback was attempted**, because nothing here observed a new image"
              summary "reaching production. Rolling back on a guess would move production to the"
              summary "build before whatever is running now."
              fail 72 "DEPLOY COULD NOT BE MEASURED for ${UNMEASURED[*]} — this is NOT a measurement that nothing shipped. $([ "$STATUS_AFTER_OK" -eq 0 ] && echo "The post-update 'rd-deploy status' call exited $STATUS_AFTER_RC, so there is no after-snapshot to compare against; 'update' had already returned 0." || echo "'rd-deploy status' was read but the line for those services is in a format this workflow does not recognise — treat it as a wrapper format change.") Containers healthy: $([ "$HEALTHY" -eq 1 ] && echo yes || echo NO). No rollback was attempted. Check 'sudo rd-deploy status' and 'sudo rd-deploy revision' on the box — the summary has the commands."
            fi

            summary "### Production deploy (backend) — CANNOT BE PROVEN"
            summary ""
            summary '```'
            summary "expected (github.sha)      $GIT_SHA"
            summary "revision before this run   ${BEFORE_REV:-<unreadable>}"
            summary "revision after  this run   ${AFTER_REV:-<could not be read>}"
            summary "revision moved this run    $([ "$REV_READ" -eq 1 ] && { [ "$REV_MOVED" -eq 1 ] && echo yes || echo no; } || echo "unknown")"
            summary "containers healthy         $([ "$HEALTHY" -eq 1 ] && echo yes || echo NO)"
            summary "probe                      $(public_word)"
            summary "recreated                  ${RECREATED[*]:-<none>}"
            summary "measured NOT recreated     ${UNCHANGED[*]:-<none>}"
            summary '```'
            summary ""
            if [ "$RECREATED_OK" -eq 1 ]; then
              summary "**\`${RECREATED[*]}\` WAS recreated — something did ship.** What cannot be proven"
              summary "is that what shipped is this commit. Do not read this run as \"nothing"
              summary "happened\"."
              summary ""
            fi
            if [ "$REV_READ" -eq 0 ]; then
              # SAY WHICH. Without this branch a 127 on the revision-after call was
              # reported as "something pushed to main while this run was in
              # flight" — a sentence about an observation that was never made.
              summary "**The deployed revision could not be read at all.** \`rd-deploy revision\`"
              summary "exited \`$REV_RC\` after the update, so this run does not know what commit the"
              summary "box is on. It is not evidence that the revision is wrong; it is the absence of"
              summary "the evidence that would say either way."
              summary ""
              case "$REV_RC" in
                127) summary "\`127\` is the login shell's *command not found*: the SSH forced command did" ; summary "not run. See the security-boundary section above — check that first." ; summary "" ;;
                64)  summary "\`64\` is EX_USAGE from the wrapper or \`rd-entry\` — a bug in this workflow," ; summary "not a fault on the box." ; summary "" ;;
                255) summary "\`255\` is ssh's transport failure, not a wrapper code. The box was not asked." ; summary "" ;;
              esac
            elif [ "$REV_OK" -eq 0 ]; then
              summary "**The deployed revision is not this commit.** It reads \`${AFTER_REV:0:12}\`, not"
              summary "\`${GIT_SHA:0:12}\`. Either something pushed to \`main\` while this run was in"
              summary "flight and the second \`update\` fetched that instead, or \`update\` did not reset"
              summary "the working tree at all. Check \`sudo rd-deploy revision\` on the box against the"
              summary "commit list before doing anything else — another deploy may be in flight."
              summary ""
            fi
            if [ "$RECREATED_OK" -eq 0 ] && [ "${#UNCHANGED[@]}" -eq "${#UPDATED[@]}" ]; then
              summary "**NOT ONE of \`${UPDATED[*]}\` was recreated**, and that is a measurement: each"
              summary "service's uptime was read before the first \`update\` and again after, and none"
              summary "of them reset. No new image reached production. In likelihood order:"
              summary ""
              summary "1. the update did not actually rebuild or replace anything — read the"
              summary "   \`update\` output above;"
              summary "2. this commit changes nothing that lands in **either** image (docs,"
              summary "   \`.github/\`, \`deploy/\`, anything in \`.dockerignore\`). Note that on this box"
              summary "   that is NOT normally enough to prevent a swap: buildx stamps a provenance"
              summary "   attestation into every build, so even an unchanged rebuild produces a new"
              summary "   image id and \`up -d\` recreates. Treat \"nothing needed to ship\" as the"
              summary "   less likely explanation here, not the default one;"
              if [ "$BEFORE_REV" = "$GIT_SHA" ]; then
                summary "3. **the box was ALREADY on this commit when the run started**. If you are"
                summary "   re-running a deploy that already succeeded, production is already on this"
                summary "   commit. But if you are re-running after applying a migration that blocked"
                summary "   an earlier run, that earlier run never built anything — so this one"
                summary "   SHOULD have recreated the container. Treat it as cause 1 and check"
                summary "   \`rd-deploy logs\`."
              else
                summary "3. the box was already on this commit — **ruled out**: it moved from"
                summary "   \`${BEFORE_REV:0:12}\` to \`${AFTER_REV:0:12}\` during this run."
              fi
              summary ""
              summary "> A **partial** non-swap is not a failure and does not reach this branch: if"
              summary "> one updated service is replaced and another is not, this run reports"
              summary "> **success** and names the one that did not move in a \`::notice::\`. Reaching"
              summary "> here means NOTHING was replaced."
              summary ""
            fi
            if [ "$HEALTHY" -eq 0 ]; then
              summary "**The containers are not healthy** — and this run did not replace them, so it"
              summary "did not cause that. That is why nothing is rolled back below: the image"
              summary "running now was not put there by this run."
              summary ""
            fi
            # This branch is reachable BOTH when nothing was replaced and when the
            # replacement could not be measured (e.g. a transient failure of the
            # revision-after call, with containers demonstrably recreated). Saying
            # "nothing observed a new image reaching production" in the second case
            # is a flat contradiction of the recreated= list printed above it.
            summary "**No rollback was attempted, on purpose.** \`rollback\` swaps the running image"
            summary "for \`:previous\`."
            if [ "${#RECREATED[@]}" -gt 0 ]; then
              summary ""
              summary "Note that \`${RECREATED[*]}\` WAS observed recreated by this run — so a new image"
              summary "did reach production. What could not be established is which commit it was"
              summary "built from, and the containers are healthy. Rolling back on that basis would"
              summary "discard a deploy that may well be correct. Settle it by hand with"
              summary "\`rd-deploy revision\` before deciding."
            else
              summary "Nothing in this run observed a new image reaching production,"
              summary "so rolling back would move production to the build before whatever is running"
              summary "now — backwards, over a deploy this run cannot show happened."
            fi
            summary ""
            summary "\`rd-deploy status\`:"; block status0.txt
            if [ "${#RECREATED[@]}" -gt 0 ]; then
              why_no_rb="No rollback was attempted — [${RECREATED[*]}] WAS recreated and is healthy, but this run could not establish which commit it was built from; discarding it on that evidence would be worse than leaving it. Run 'rd-deploy revision' to settle it."
            else
              why_no_rb="No rollback was attempted — nothing here observed a new image reaching production, and rolling back one that was never replaced moves production backwards."
            fi
            fail 72 "DEPLOY COULD NOT BE PROVEN (revision_read=$REV_READ revision_ok=$REV_OK revision_moved=$REV_MOVED recreated_ok=$RECREATED_OK replaced_ok=$REPLACED_OK healthy=$HEALTHY; recreated=[${RECREATED[*]:-<none>}] measured-not-recreated=[${UNCHANGED[*]:-<none>}]). $why_no_rb The evidence and the possible causes are in the job summary."
          fi

          # =====================================================================
          # 5. It did not come back. Collect evidence, then roll the IMAGE back.
          # =====================================================================
          # WHICH SERVICE IS ACTUALLY SICK. `rd logs backend` was hard-coded
          # here. When PYTHON is the unhealthy one — and python is updated first,
          # so it is a real possibility — that collected a hundred lines of a
          # perfectly happy API and none of the failure, in the summary someone
          # reads at 2am. `wait_healthy` leaves its last poll in status.txt; fall
          # back to the post-update snapshot, and to every updated service if
          # neither names a culprit.
          echo "== HEALTH CHECK FAILED — collecting logs"
          # Prefer wait_healthy's last poll ONLY if it was a real capture. A FAILED
          # capture holds ssh's error text; reading it as a status listing gives
          # every service verdict 3 and puts services nobody looked at into the
          # summary as "not healthy".
          LAST_STATUS=status0.txt
          if [ "${HEALTH_LAST_OK:-0}" -eq 1 ] && [ -s status.txt ]; then LAST_STATUS=status.txt; fi
          FAILING=()
          for s in "${UPDATED[@]}"; do
            svc_verdict "$s" "$LAST_STATUS" || FAILING+=("$s")
          done
          # Anything already observed broken counts, even if the snapshot chosen
          # above no longer names it.
          for s in ${BROKEN[*]:-} ${BROKEN_LATE[*]:-}; do
            case " ${FAILING[*]:-} " in *" $s "*) ;; *) FAILING+=("$s") ;; esac
          done
          if [ "${#FAILING[@]}" -eq 0 ]; then
            echo "  no single service is named unhealthy by $LAST_STATUS; collecting logs for all of: ${UPDATED[*]}"
            FAILING=("${UPDATED[@]}")
          else
            echo "  not healthy according to $LAST_STATUS, plus anything already observed broken: ${FAILING[*]}"
          fi
          summary "### Production deploy (backend) — FAILED ITS HEALTH CHECK"
          summary ""
          # SAY ONLY WHAT WAS MEASURED. This used to open with "The containers were
          # recreated at <sha> — the code shipped", which asserts two things this
          # branch does not always know: that an uptime reset was seen, and that the
          # deployed revision is this commit.
          if [ "${#RECREATED[@]}" -gt 0 ]; then
            summary "\`${RECREATED[*]}\` **was recreated** by this run: its uptime reset between the"
            summary "snapshot taken before the first \`update\` and the one taken after."
            summary ""
          fi
          if [ "${#BROKEN[@]}" -gt 0 ]; then
            summary "\`${BROKEN[*]}\` is **not running**. The snapshot taken straight after the update"
            summary "shows it in a recognised failed state — no uptime, because it is not up:"
            summary ""
            summary '```'
            for s in "${BROKEN[@]}"; do summary "$(svc_line "$s" status0.txt)"; done
            summary '```'
            summary ""
            summary "\`update\` returned **0** for it, so the wrapper built the image and ran"
            summary "\`up -d\`. Read this as **a new image that does not stay up** until the logs"
            summary "below say otherwise. The rollback further down is the response to exactly this."
            summary ""
          fi
          if [ "${#BROKEN_LATE[@]}" -gt 0 ]; then
            summary "\`${BROKEN_LATE[*]}\`: the recreation proof could not run for it — the post-update"
            summary "\`status\` call exited \`$STATUS_AFTER_RC\` — but the health poll observed it in a"
            summary "recognised failed state, which is why it is being rolled back:"
            summary ""
            summary '```'
            for s in "${BROKEN_LATE[@]}"; do summary "$(svc_line "$s" status.txt)"; done
            summary '```'
            summary ""
          fi
          if [ "${#UNCHANGED[@]}" -gt 0 ]; then
            summary "\`${UNCHANGED[*]}\` was measured as **not** replaced by this run (its uptime did"
            summary "not reset). It is rolled back below only if it is in the updated set and the"
            summary "stack is being put back as a whole — the image it is running is not one this"
            summary "run installed."
            summary ""
          fi
          if [ "$REV_OK" -eq 1 ]; then
            summary "The deployed revision reads \`$GIT_SHA\`, so the code on the box is this commit."
          elif [ "$REV_READ" -eq 0 ]; then
            summary "The deployed revision **could not be read** (\`rd-deploy revision\` exited"
            summary "\`$REV_RC\`), so this run cannot say which commit the box is on."
          else
            summary "The deployed revision reads \`${AFTER_REV:0:12}\`, **not** \`${GIT_SHA:0:12}\` —"
            summary "check whether another deploy is in flight before acting on the rollback below."
          fi
          summary ""
          summary "The services did not come back healthy within ${HEALTH_TIMEOUT}s."
          summary ""
          if [ "$PRE_SICK" -eq 1 ]; then
            summary "> **Note:** at least one of these services was ALREADY not healthy in the status"
            summary "> read taken before this deploy started. This may be a pre-existing outage"
            summary "> rather than a regression this commit caused. The rollback below is still"
            summary "> attempted, because the previous build is the known-good state either way."
            summary ""
          fi
          # LABEL THE CAPTURE FOR WHAT IT IS. When the post-update `status` call
          # failed, status0.txt holds ssh's error text — printing that under a
          # bare "`rd-deploy status`:" heading presents an error as a reading.
          if [ "$STATUS_AFTER_OK" -eq 1 ]; then
            summary "\`rd-deploy status\`, straight after the update:"; block status0.txt
          else
            summary "The post-update \`rd-deploy status\` call FAILED (exit \`$STATUS_AFTER_RC\`). This"
            summary "is what came back instead of a status listing:"
            block status0.txt
          fi
          if [ "$LAST_STATUS" != status0.txt ]; then
            summary "\`rd-deploy status\`, last poll of the health check:"; block "$LAST_STATUS"
          fi
          summary "Not healthy, according to \`$LAST_STATUS\`: **${FAILING[*]}**. Their logs:"
          for s in "${FAILING[@]}"; do
            rd logs "$s" > "logs-$s.txt" 2>&1 || true
            echo "---- rd-deploy logs $s"
            tail -n 60 "logs-$s.txt" || true
            summary "\`rd-deploy logs $s\` (last 100 lines):"; block "logs-$s.txt"
          done

          # Reverse of the deploy order: backend first, so the API every till talks
          # to is back on a known-good build before the sidecar is touched.
          echo "== rolling back"
          RB_RC=0
          NOPREV=0
          NOPREV_SVCS=()
          for s in backend python; do
            case " ${UPDATED[*]} " in *" $s "*) ;; *) continue ;; esac
            echo "== rd-deploy rollback $s"
            rd rollback "$s" > "rollback-$s.txt" 2>&1
            rc=$?
            cat "rollback-$s.txt"
            summary "\`rd-deploy rollback $s\`:"; block "rollback-$s.txt"
            if [ "$rc" -eq 127 ]; then not_installed "rollback $s"; fi
            if [ "$rc" -ne 0 ]; then RB_RC="$rc"; fi
            # `noprev_warned` matches the wrapper's actual sentence. The detector
            # it replaces matched any line containing "warn" AND any line
            # containing "previous" — both of which a rollback that WORKED
            # prints, so a successful rollback was reported as "the code was NOT
            # reverted". See the function's comment for why that FALSE POSITIVE
            # is the likely direction. It still reads wording, so if the wrapper
            # is reworded the detection goes quiet: read the captured output
            # above rather than trusting this line alone.
            if noprev_warned "rollback-$s.txt"; then
              NOPREV=1
              NOPREV_SVCS+=("$s")
              summary "> \`rollback $s\` warned that there is **no \`:previous\` image**. The container"
              summary "> was force-recreated on the SAME image. **The code was not reverted.**"
              summary ""
            elif restored_previous "rollback-$s.txt" "$s"; then
              echo "  the wrapper confirmed: restored restaurant-dash-$s:previous"
              summary "> \`rollback $s\` reported \`restored restaurant-dash-$s:previous\` — the"
              summary "> previous image is back on \`:latest\`."
              summary ""
            fi
          done

          # VERIFY HEALTH FIRST. This ordering is the fix, and it is the reverse
          # of what it was.
          #
          # The no-`:previous` branch used to sit ABOVE this check, so any run
          # that tripped the detector never ran the post-rollback health
          # verification at all — it went straight to exit 74. Combined with a
          # detector that fired on a SUCCESSFUL rollback (see `noprev_warned`),
          # that meant a rollback which had genuinely restored the previous image
          # and brought production back was reported as "the code was NOT
          # reverted", with no evidence collected about whether production had in
          # fact recovered.
          #
          # So: find out whether it came back, and only then say what kind of
          # recovery it was. A rollback that demonstrably restored health can no
          # longer be reported as no rollback at all.
          if [ "$RB_RC" -eq 0 ] && wait_healthy "${UPDATED[@]}"; then
            rd status > status1.txt 2>&1 || true
            rd revision > rev-rollback.txt 2>&1 || true
            summary "\`rd-deploy status\` after the rollback:"; block status1.txt

            if [ "$NOPREV" -eq 1 ]; then
              # Healthy again, but NOT reverted. Still a 74: what is running is
              # the commit that just failed, it merely survived the restart.
              summary ""
              summary "### Healthy again — but the code was NOT reverted"
              summary ""
              summary "\`rollback\` printed the wrapper's *no rollback target* warning for"
              summary "**${NOPREV_SVCS[*]}**: there was no \`:previous\` image — the first \`update\` of that service"
              summary "on this box — so it force-recreated the CURRENT image. The services did come"
              summary "back healthy, but they came back on \`$GIT_SHA\`, **the commit that just failed"
              summary "its health check**. A restart is not a rollback."
              summary ""
              summary "Treat this as production running code that has already failed once and then"
              summary "passed. The only real revert is in git:"
              summary ""
              summary '```sh'
              summary "git revert $GIT_SHA && git push        # then dispatch this workflow again"
              summary '```'
              fail 74 "THERE WAS NO ROLLBACK TARGET. No ':previous' image existed for ${NOPREV_SVCS[*]}, so the container was force-recreated on the SAME image and the code was NOT reverted. It DID come back healthy this time, but production is running $GIT_SHA — the commit that just failed its health check. Revert on main and dispatch again."
            fi

            summary ""
            summary "### Production is running the PREVIOUS IMAGES — but the box is still on this commit"
            summary ""
            summary "\`rollback\` retagged \`:previous\` back to \`:latest\` and force-recreated, so the"
            summary "running code is the build from before this run. It did **not** touch the git"
            summary "working tree:"
            summary ""
            block rev-rollback.txt
            summary "That still reads \`$GIT_SHA\`, and it will keep reading it. **The next \`update\` of"
            summary "\`backend\` or \`python\` — a re-run of this workflow, or someone shipping an"
            summary "unrelated fix — will rebuild this commit and put it straight back into"
            summary "production.** The image rollback is a stopgap; the fix is:"
            summary ""
            summary '```sh'
            summary "git revert $GIT_SHA && git push       # then dispatch this workflow"
            summary '```'
            summary ""
            summary "Do not re-run this run. It would rebuild exactly what was just rolled back."
            fail 70 "Deploy failed its health checks and the IMAGE was ROLLED BACK — production is running the previous build. The git working tree on the box is STILL at $GIT_SHA, so the next 'update' of backend or python will redeploy this commit unless it is reverted on main. Do not re-run this workflow; revert the commit. Details in the job summary."
          fi

          # Still not healthy. Now say WHICH of the three things went wrong,
          # instead of "ROLLBACK ALSO FAILED (rollback exit 0)" — which is what
          # this printed whenever the rollback call had actually succeeded and it
          # was the SERVICE that did not come back.
          rd status > status1.txt 2>&1 || true
          summary "\`rd-deploy status\` after the rollback attempt:"; block status1.txt
          summary ""

          if [ "$NOPREV" -eq 1 ]; then
            summary "### There was no rollback target, and production is still unhealthy"
            summary ""
            summary "\`rollback\` printed the wrapper's *no rollback target* warning for"
            summary "**${NOPREV_SVCS[*]}**: no \`:previous\` image existed — the first \`update\` of that"
            summary "service on this box — so it could only force-recreate what was already"
            summary "there. **The code was not reverted.** Production is running \`$GIT_SHA\`, the"
            summary "commit that just failed, and it is still unhealthy."
            summary ""
            summary "Recover by hand. The only real revert is in git:"
            summary ""
            summary '```sh'
            summary "# on your workstation"
            summary "git revert $GIT_SHA && git push        # then dispatch this workflow again"
            summary ""
            summary "# or, on the VPS, to see why it is unhealthy first:"
            for s in "${FAILING[@]}"; do
              summary "sudo /usr/local/sbin/rd-deploy logs $s"
            done
            summary "sudo /usr/local/sbin/rd-deploy status"
            summary '```'
            fail 74 "UNHEALTHY AND THERE WAS NO ROLLBACK TARGET. No ':previous' image existed for ${NOPREV_SVCS[*]}, so the container was force-recreated on the SAME image and the code was NOT reverted. Production is running $GIT_SHA, unhealthy. Revert the commit on main and dispatch again — see the job summary."
          fi

          if [ "$RB_RC" -eq 0 ]; then
            summary "**The \`rollback\` call itself SUCCEEDED (exit 0).** The wrapper retagged"
            summary "\`:previous\` back to \`:latest\` and force-recreated, so the PREVIOUS build is what"
            summary "is running — and the services still did not come back healthy within"
            summary "${HEALTH_TIMEOUT}s. **Production may be down, and the known-good build is not"
            summary "fixing it**, which points somewhere outside these images: the database, Valkey,"
            summary "the host itself, or a migration that has already been applied and that the"
            summary "previous build cannot read."
            fail 71 "ROLLBACK RAN, PRODUCTION DID NOT COME BACK. The 'rollback' call SUCCEEDED (exit 0) and the previous images are running, but the services are still unhealthy after ${HEALTH_TIMEOUT}s — so the fault is probably not in these images (database, Valkey, host, or an already-applied migration the previous build cannot read). PRODUCTION MAY BE DOWN. Do not re-run this workflow — further automated churn destroys the evidence. SSH in as a human: 'sudo rd-deploy status', 'sudo rd-deploy logs ${FAILING[0]}', 'sudo rd-deploy revision', and check the ingress with 'journalctl -u cloudflared'."
          fi

          summary "**The \`rollback\` call itself FAILED**, exit $RB_RC. The previous image may not"
          summary "even have been restored. **Production may be down.**"
          fail 71 "THE ROLLBACK CALL FAILED (exit $RB_RC) — the previous image may not have been restored at all. PRODUCTION MAY BE DOWN. Do not re-run this workflow — further automated churn destroys the evidence. SSH in as a human: 'sudo rd-deploy status', 'sudo rd-deploy logs ${FAILING[0]}', 'sudo rd-deploy revision', and check the ingress with 'journalctl -u cloudflared'."

      # The key is the one credential this job holds. Wipe it whether the deploy
      # succeeded, failed, was cancelled, or the step above exited early.
      - name: Wipe the deploy key from the runner
        if: always()
        run: shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
