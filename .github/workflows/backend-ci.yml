name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RECEPTION_API_BASE_URL: http://localhost:3000
      RESTAURANT_ID: csrorganics
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      MONGODB_CONNECT_RETRIES: '5'
      MONGODB_CONNECT_BASE_DELAY_MS: '250'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start API
        run: node ./build/index.js &

      - name: Wait for /health
        run: |
          for i in {1..40}; do
            if curl -sSf http://localhost:3000/health > /dev/null; then
              echo "Server is up"; exit 0;
            fi
            sleep 0.5
          done
          echo "Server did not start"; exit 1

      - name: Allocation regression
        run: npm run test:allocation

      - name: Overlap regression
        run: npm run test:overlap

      - name: Threshold regression
        run: npm run test:threshold

      - name: Jest unit tests
        run: npm run jest -- --passWithNoTests
