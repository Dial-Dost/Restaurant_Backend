name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BACKEND_API_BASE_URL: http://localhost:3001
      RESTAURANT_ID: csrorganics
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      SUPABASE_IPV4_URL: ${{ secrets.SUPABASE_IPV4_URL }}
      SUPABASE_DEFAULT_API_KEY: ${{ secrets.SUPABASE_DEFAULT_API_KEY }}
      SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-dev tsx

      # Money invariants. Runs BEFORE the stack comes up because it needs neither
      # a database nor Docker: the bill set is in memory and only `pg` is faked,
      # so the real report readers are exercised. Placed first so a service-charge
      # / tax regression fails the build in seconds and can never be masked by an
      # unreachable DB or a docker-compose problem.
      - name: Money invariants (bill totals vs report readers)
        run: npm run test:money

      - name: Write .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "SUPABASE_DIRECT_URL=${{ secrets.SUPABASE_DIRECT_URL }}" >> .env
          echo "DATABASE_URL=${{ secrets.SUPABASE_DIRECT_URL }}" >> .env
          echo "DIRECT_URL=${{ secrets.SUPABASE_DIRECT_URL }}" >> .env
          echo "SUPABASE_IPV4_URL=${{ secrets.SUPABASE_IPV4_URL }}" >> .env
          echo "SUPABASE_DEFAULT_API_KEY=${{ secrets.SUPABASE_DEFAULT_API_KEY }}" >> .env
          echo "SUPABASE_PROJECT_URL=${{ secrets.SUPABASE_PROJECT_URL }}" >> .env
          echo "QR_SIGNING_SECRET=ci-only-non-secret-qr-key-for-tests" >> .env

      - name: Set up Docker Compose
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in {1..40}; do
            if curl -sSf ${BACKEND_API_BASE_URL}/health > /dev/null; then
              echo "Server is up"; exit 0;
            fi
            sleep 0.5
          done
          echo "Server did not start"; exit 1

      - name: Feedback (Dashboard) API Tests
        run: npm run test:feedback_api

      - name: Valet and feedback Question API test
        run: npm run test:valet_api

      - name: Jest unit tests
        run: npm run jest -- --passWithNoTests

      - name: Tear down
        if: always()
        run: docker compose down
