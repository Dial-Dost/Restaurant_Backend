services:
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: restaurant_python
    environment:
      - PY_SERVER_PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      # Python is guaranteed present in this image; the FastAPI app answers on /.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: restaurant_node
    depends_on:
      python:
        condition: service_healthy
    environment:
      - PY_SERVER_URL=http://python:8000
      - PY_SERVER_PORT=8000
    ports:
      - "3001:3001"
    restart: unless-stopped
    env_file:
      - .env
    command: [ "npm", "run", "start" ]
    healthcheck:
      # Express exposes GET /health on PORT (default 3001).
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
